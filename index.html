    </div>
  `);
  document.getElementById('adm-back').addEventListener('click', showHome);
  loadAdminPanel();
}
window.showAdmin = showAdmin;

let _adminUsers = [];
let _adminFilter = 'all';
let _adminSortDesc = true; // cei mai noi primii

async function loadAdminPanel() {
  try {
    const snap = await window._getDocs(window._collection(window._db, 'users'));
    _adminUsers = [];
    snap.forEach(d => { _adminUsers.push({ uid: d.id, ...d.data() }); });
    renderAdminStats();
    applyAdminFilters();
  } catch(e) {
    document.getElementById('adm-list').innerHTML = '<div style="color:red;padding:16px">Eroare: '+e.message+'</div>';
  }
}

window.toggleAdminSort = function() {
  _adminSortDesc = !_adminSortDesc;
  const btn = document.getElementById('adm-sort-btn');
  if (btn) btn.textContent = _adminSortDesc ? '📅 Cei mai noi' : '📅 Cei mai vechi';
  applyAdminFilters();
};

window.applyAdminFilters = function() {
  const q = (document.getElementById('adm-search')?.value || '').toLowerCase().trim();
  let users = _adminFilter === 'all' ? _adminUsers : _adminUsers.filter(u => getAdmStatus(u) === _adminFilter);
  if (q) users = users.filter(u => (u.email||'').toLowerCase().includes(q));
  users = users.slice().sort((a, b) => {
    const ta = (a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt?.seconds*1000||0)).getTime();
    const tb = (b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt?.seconds*1000||0)).getTime();
    return _adminSortDesc ? tb - ta : ta - tb;
  });
  renderAdminList(null, users);
};

function getAdmStatus(u) {
  if (u.blocked) return 'blocked';
  if (u.paid)    return 'paid';
  const created = u.createdAt?.toDate ? u.createdAt.toDate() : new Date(u.createdAt?.seconds*1000||0);
  const days = (Date.now() - created.getTime()) / 86400000;
  return days < TRIAL_DAYS ? 'trial' : 'expired';
}

function getTrialLeft(u) {
  const created = u.createdAt?.toDate ? u.createdAt.toDate() : new Date(u.createdAt?.seconds*1000||0);
  const days = (Date.now() - created.getTime()) / 86400000;
  return Math.max(0, TRIAL_DAYS - days);
}

function renderAdminStats() {
  const counts = { trial:0, paid:0, expired:0, blocked:0 };
  _adminUsers.forEach(u => counts[getAdmStatus(u)]++);
  const el = document.getElementById('adm-stats');
  if (!el) return;
  el.innerHTML = [
    ['Probă','#e67e00',counts.trial],
    ['Plătit','#1a7a1a',counts.paid],
    ['Expirat','#a00',counts.expired],
    ['Blocat','#444',counts.blocked]
  ].map(([l,c,n]) => `<div style="flex:1;min-width:70px;background:${c};color:#fff;border-radius:10px;padding:10px;text-align:center"><div style="font-size:24px;font-weight:800">${n}</div><div style="font-size:11px;opacity:.85">${l}</div></div>`).join('');
}

function renderAdminList(filter, users) {
  const el = document.getElementById('adm-list');
  if (!el) return;
  if (!users) users = filter === 'all' || !filter ? _adminUsers : _adminUsers.filter(u => getAdmStatus(u) === filter);
  if (!users.length) { el.innerHTML = '<div style="text-align:center;padding:30px;color:#888">Niciun utilizator</div>'; return; }
  const statusLabel = { trial:'🟡 Probă', paid:'🟢 Plătit', expired:'🔴 Expirat', blocked:'⚫ Blocat' };
  el.innerHTML = users.map(u => {
    const st  = getAdmStatus(u);
    const tl  = getTrialLeft(u);
    const created = u.createdAt?.toDate ? u.createdAt.toDate() : new Date(u.createdAt?.seconds*1000||0);
    const dateStr = created.toLocaleDateString('ro-RO');
    return `
    <div style="background:#1e1e1e;border-radius:12px;padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px">
        <div>
          <div style="font-size:13px;font-weight:600;color:#eee;word-break:break-all">${u.email}</div>
          <div style="font-size:11px;color:#888;margin-top:2px">Înregistrat: ${dateStr} · ${statusLabel[st]}${st==='trial'?' ('+tl.toFixed(1)+' zile)':''}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${st!=='paid' && st!=='blocked' ? `<button onclick="adminMarkPaid('${u.uid}')" style="background:#1a7a1a;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer">✅ Plătit</button>` : ''}
        ${st!=='blocked' ? `<button onclick="adminBlockUser('${u.uid}','${u.email.replace(/'/g,"\\'")}','block')" style="background:#444;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer">🚫 Blochează</button>` : ''}
        ${st==='blocked' ? `<button onclick="adminBlockUser('${u.uid}','${u.email.replace(/'/g,"\\'")}','unblock')" style="background:#e67e00;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer">🔓 Deblochează</button>` : ''}
        ${st==='expired'||st==='trial' ? `<button onclick="adminExtendTrial('${u.uid}')" style="background:#003a6e;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer">⏳ +2 zile</button>` : ''}
      </div>
    </div>`;
  }).join('');
}
window.renderAdminList = renderAdminList;

window.filterAdminList = function(filter, btn) {
  _adminFilter = filter;
  document.querySelectorAll('.adm-filter').forEach(b => b.classList.remove('adm-filter-active'));
  if (btn) btn.classList.add('adm-filter-active');
  applyAdminFilters();
};

window.adminMarkPaid = async function(uid) {
  if (!confirm('Marchezi utilizatorul ca plătit?')) return;
  await window._updateDoc(window._doc(window._db,'users',uid), { paid: true, blocked: false });
  const u = _adminUsers.find(x => x.uid === uid);
  if (u) { u.paid = true; u.blocked = false; }
  renderAdminStats();
  renderAdminList(document.querySelector('.adm-filter-active')?.dataset.f || 'all');
};

window.adminBlockUser = async function(uid, email, action) {
  const msg = action === 'block' ? `Blochezi ${email}?` : `Deblochezi ${email}?`;
  if (!confirm(msg)) return;
  const blocked = action === 'block';
  await window._updateDoc(window._doc(window._db,'users',uid), { blocked });
  const u = _adminUsers.find(x => x.uid === uid);
  if (u) u.blocked = blocked;
  renderAdminStats();
  renderAdminList(document.querySelector('.adm-filter-active')?.dataset.f || 'all');
};

window.adminExtendTrial = async function(uid) {
  const u = _adminUsers.find(x => x.uid === uid);
  if (!u) return;
  const created = u.createdAt?.toDate ? u.createdAt.toDate() : new Date(u.createdAt?.seconds*1000||0);
  const newCreated = new Date(created.getTime() + 2*86400000);
  const { Timestamp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const ts = Timestamp.fromDate(newCreated);
  await window._updateDoc(window._doc(window._db,'users',uid), { createdAt: ts });
  u.createdAt = { toDate: () => newCreated };
  renderAdminStats();
  renderAdminList(document.querySelector('.adm-filter-active')?.dataset.f || 'all');
};

// Start — onAuthStateChanged handles routing
showLogin();
</script>
