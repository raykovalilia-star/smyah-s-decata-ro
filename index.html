      {
        id: `bancuri2_en`,
        title: `Jokes`,
        icon: `😂`,
        type: `list`,
        items: [
          {q:`The child has two obligations to the mother:<br>1. To calm her down when she is angry.<br>2. To make her angry when she's calm.`},
          {q:`A teacher asks:<br>-Alex, how can you write that the swallows lined up like sausages on the wires?<br>- Well... I was hungry!`},
          {q:`A mother says to her son:<br>- I prepared a beetroot salad and tofu cheese meatballs for you.   Shall I prepare something else for you?<br>- Yes, prepare my backpack too!   I'm going to Grandma's!`},
          {q:`A mother says to her daughter:<br>- Let's play hide and seek!  Hide well, because if I find you, I will tickle you a lot!<br>- Good!  If you don't find me, I'll be waiting for you next to the wardrobe!<br>A mother scolds her naughty son:<br>- How did you manage to do so much mischief in one day?<br>- I got up early today!`},
          {q:`Teacher asks:<br>- Adam, why are you late for school?<br>- Well, madam, I fell on the pillow and lost consciousness for an hour.`},
          {q:`At the zoo, a mother scolds her child:<br>"Ben, don't touch the tiger!  There might be fleas!”`},
          {q:`Teacher asks:<br>- Peter, why don't you have a notebook and a pencil?<br>- Madam, it's 7:30 in the morning!  Be glad that I am here!`},
          {q:`Dad says that in order not to get sick, he switched to vitamin-Triple C– Cheese, Chips, Chicken.`},
          {q:`People invented navigation for distracted mothers.  Navigation shows how to get to the address, but also it reminds them why they were going there.<br>Mum was looking for her phone under the bed today, while shining with the flashlight of that same phone... I was just watching, so as not to distract her.<br>Two dads were talking to each other:<br>- What a studious and good daughter you have!  How old is she?<br>- 3 weeks, without a phone.<br>Two mothers are talking to each other:<br>- Ana, did you hear, special jars for losing weight are being sold!<br>- And what are these jars?<br>- You open them and inside they are empty!`},
          {q:`Mother asks:<br>- Nick, what is your favourite subject at school?<br>- The ball, mum!`},
          {q:`-Pete, which days are the most difficult for you at school?<br>- The first 5 days after Sunday!`},
          {q:`- Dona, why do you have a school absence today?<br>- Well, because there are report cards!  If there were no report cards, there would be no absence.<br>Mother wakes up a first grader:<br>- Nick, get up!  Dress well, it's raining today.<br>- Oh, if it rains, I won't go to school!<br>- Why?<br>- When it rains, we don't play football in the yard, why should I go?<br>A PE teacher has class with first graders.<br>- March 2 laps!  Forward, march!  Left, left, left!<br>- Coach, what should I do with my right leg?  Danny asks.`},
          {q:`What is the origin of ‘ladies first’?<br>In the past, when primitive people found new caves to live in, they let the women go in first.  If no one ate them, then everyone entered.`},
          {q:`A grandmother asked her grandson's mother (her daughter):<br>- Why did we teach the child to talk and walk for so many months, and now you call him "Stop", "Shut up for a while!”<br>Two teenage girls on a diet sit down in a pastry shop.  The waitress comes and the girl asks her:<br>- What would you recommend?  Please keep it sugar and fat free.<br>- Yes, I offer you the napkins!<br>Two teenagers are complaining:<br>- In the morning, when I hear my mother waking me up, it's like I'm being hit with hammers.<br>- Well, are you jumping right away?<br>- No, I'm lying like I've been beaten with hammers and I'm not moving.`},
          {q:`Ryan calls his grandmother:<br>- Grandma, I'm coming to make pancakes for me because your daughter is still sleeping.`},
          {q:`They ask a child:<br>- Who do you love more - mum or dad?<br>- Grandpa!<br>Grandma, why are your ears so big?<br>To hear when your stomach rumbles with hunger, my dear!`},
          {q:`Children learn Indian dances.  The teacher gives instructions:<br>- Children, imagine that with one hand you screw in a light bulb, and with the other you knock the crumbs off the chair.  (Try the move yourself!)`},
          {q:`- Grandma, how old are you?<br>- Too old, dear!<br>- Well, if you don't know, look at the label on the blouse!  Mine says 7 years old - size 122`},
          {q:`- Dad, the Christmas tree lights are burning!<br>- Son, we say they shine; they don't burn!<br>- Dad, dad, the whole Christmas tree is shining and the curtain is shining, and the carpet is shining…`},
          {q:`Father cooks eggs and proudly says to the mother:<br>- Now I will cook the most delicious omelette for the first time in my life!<br>- I realized it was the first time.  Next time cook the eggs without the shells!`},
          {q:`Father cooks lentils and asks mother:<br>- How do you know the lentils won't taste good?<br>- You are already putting in a second spoonful of cocoa!<br>- Well, what else will make it brown!?`},
          {q:`-Emma, what will you become when you grow up?<br>-A singer, because yesterday my neighbour gave me 5 EUR to shut up. That's how I found out I could make money by singing!`},
          {q:`The teacher is testing Peter:<br>- Peter, you still haven’t studied, I'll write you an F!<br>- Miss, I don't want to scare you, but Daddy says if he sees one more F in my report card, someone will get hurt!`},
          {q:`A child doesn't want to go to sleep and the mother asks the father:<br>- Shall I sing him a song?<br>- No dear, try with kindness first! Don't upset him!`},
          {q:`A second grader got asked what a brain was.<br>- The brain is used for headaches. When a person has a runny nose, the brain comes out through the nose. The brain is very sensitive so it is good to protect it and think less!`},
          {q:`- Mummy, when exactly will Santa Claus come?<br>- Why, Chris?<br>- Well, I'm getting tired of being good and obedient, it's a bit boring! How much longer?`},
          {q:`The mother asks the child:<br>- Tom, did you have beans for lunch at school today?<br>- "Yes!" replied Tom and confirmed what he had said very soundly.`},
          {q:`At school they measured the children's weight and height. Emma returns home and asks her grandmother:<br>- Grandma, how much do you weigh?<br>- 72 kg. with the glasses, my child.<br>- And without the glasses?<br>- Without them I don't know, I can't see the scale.`},
          {q:`Child, anxiously talking to her mother:<br>- Mum, I'm eating, you're cooking. I get dirty, you clean. I make a mess, you tidy. It's a good thing you gave birth to me, what would you do if I wasn't there?`},
          {q:`Parents leave after a walk in the mall. The mother tries to fold the child's stroller while the father arranges the bags.<br>- Honey, I can't fold the stroller, I've tried twice already!<br>- First you have to take the child out and then fold the stroller!`},
          {q:`In a toy store a kid wants to buy his 15th car with a remote control. The mother refuses to buy it and the child starts crying loudly. They walk into the store but he doesn't stop screaming. At one point the child stops crying.<br>- Thank you for stopping crying, this car is really a big piece of junk, and you have plenty at home!" the mother proudly encourages him.<br>- I got tired and I'm resting now! After a while I will start to cry again, but louder!`},
          {q:`This year mum decided to write a letter to Santa too.<br>"Dear Santa, I've been very good this year and I'm only going to ask for two things! I want to lose weight and I want more money!"<br>Santa replied with a letter:<br>"Stop eating the children's leftovers and stop buying them so many toys!"`},
          {q:`Parents are having a conversation:<br>- I made the child eat 8 meatballs and 2 slices of bread, not to take the medicine on an empty stomach. - Concerned father says.<br>- "It wasn’t necessary. His ears hurt and I'm treating him with ear drops!" the mother said angrily.`},
          {q:`Mother in front of the wardrobe:<br>A little black dress, a little red dress, a little summer yellow dress...the one on the dots is too little for me too...`},
          {q:`It's evening. Mother asks the child who is lying in its room alone:<br>- How are you, my dear?<br>- I'm lying down sad because I have school tomorrow... And how I wish I was lying down happy!`},
          {q:`Alex visits Peter. He opens the fridge and sees empty bottles of soft drinks.<br>- Peter, why do you have empty bottles in the fridge?<br>- To give it to guests who don't want anything to drink.`},
          {q:`In a PE class, the coach says to a kid:<br>- Tony, make a bridge!<br>- Sure...What am I, a builder?`},
          {q:`At the end of the summer vacation, a mother of a future third grader anxiously asks her son:<br>- The vacation is over, what are you going to tell the teacher? What have you read?<br>- Mum, relax, I read every day! Every day when I'm in the store - I read the labels. Do you know how many labels there are in the store?`},
          {q:`Grandma's coming home. The apartment is in a complete chaos: pots, toys, clothes, pots of dirt, everything on the floor...<br>Horrified, she asks Grandpa:<br>- Have thieves come in? Have they robbed us?<br>- No, the grandchildren have been visiting us for a while.`},
          {q:`A mother is angry with her child:<br>- Why did you drink the whole bottle of Coca-Cola? You know I don't allow that!<br>- Mummy, I lost the cap and was afraid it would spill.`},
          {q:`After a maths class, the teacher asks:<br>- Ben, what did you remember?<br>- Always to keep one thing in mind, ma'am!`},
          {q:`A father scolds his son:<br>- Son, there's nothing in your head! Listen, it sounds empty!" and taps his fingers on the table so his son can hear...<br>- Father, someone is knocking on the door!<br>- Stay here, my son, I'll open the door! - the father stood up.`},
          {q:`Grandson anxiously asks his grandfather:<br>- Grandpa, for whom are you eating?<br>- What do you mean? For myself.<br>- Grandmother said you eat for four.`},
          {q:`Grandmother to her grandchild:<br>- Ted, tomorrow we have to turn back the clocks.<br>- Grandma, no way, I like mine and I don't remember where Daddy bought it for me!`},
          {q:`Mother and daughter getting ready to go out:<br>- Mum, where are we going?<br>- Today they're opening an exhibition in the centre. We're going to an exhibition.<br>- And you think anyone will want to watch us?`},
          {q:`A child complains to his grandmother:<br>- Oh, grandma, these sausages must be spoiled. I feel uneasy!<br>- How many did you eat, Tony?<br>- 12, grandma, and three slices of bread.`},
          {q:`A child calls the police:<br>- Hello, I'm being held here by force!<br>- Where are you?<br>- At school.`},
          {q:`A mother enters the children's room:<br>- Children, your room looks as if the toy cabinet sneezed and the wardrobe vomited on the floor…`},
          {q:`It's morning. A dentist comes to work and meets his nurse in front of the office:<br>- Good morning, are there any patients?<br>- Yes, the first one is a 12-year-old boy, we're going to extract his molar.<br>- Okay, let's go into the office. - said the doctor.<br>- We can't, he locked himself in from the inside.`},
          {q:`It is evening. A child asks his mother:<br>- Mum, can I have a piece of chocolate?<br>- No! - said the mother.<br>- Oh, I love you so much! I didn't really want a piece as well, are you giving me the whole chocolate or half?`},
          {q:`The godmother is visiting her godson. She asks him worriedly:<br>- How much money did you collect from the family for the holidays?<br>- A lot! - the godson replies.<br>- You should buy something, because the inflation will eat up your money! - she advises him.<br>- It's okay, I don't know it and it doesn't know where I am! - the godson replies confidently.`},
          {q:`Nikki asks his mother to buy him a toy at the store. The mother refuses, and Nikki confidently reassures her:<br>- Mum, don't worry, I'll give you the money when we get home! Then I'll make more money.<br>- And how will you do it?<br>- I will go to grandma's and she will give me- 5 or 10 EUR. That's how you get money, mum!`},
          {q:`Grandfather teaches his grandson:<br>- You need to eat more! At least 5 times a day.<br>- Why, grandpa?<br>- To grow up!<br>- Yes, and why are you eating then? You are already grown up!`},
          {q:`A mother returns home from the hairdresser. She feels very beautiful with her new short haircut.<br>Her daughter greets her:<br>- Oh, mum, don't worry! Soon your hair will grow back and you will be beautiful again!`},
          {q:`A mother greets her son after school:<br>- I'm so angry! Today I got a notification in the report card app, you got another bad grade!<br>- Mum, if this electronic report card makes you so angry, delete it from your phone! I delete the apps I don't like.`},
          {q:`A Mother gets angry at her children:<br>- Children, I'm sick of this Lego that's all over the floor!<br>- Mum, put on your slippers! We can't clean up every day!`},
          {q:`Two brothers, 9 and 12 years old, are visiting their grandmother.`},
          {q:`One of them runs to her and yells:`},
          {q:`- Grandma, my brother hit me with the chair!`},
          {q:`The grandmother yelled:`},
          {q:`- Alex, why did you hit your brother with the chair?`},
          {q:`- Because the table was too heavy to lift it!`},
          {q:`A mum is solving maths problems with her second grader:<br>- Phill, you have 20 candies. How many will you have left if you give 7 to your sister?<br>- 19, mum.<br>- And how exactly did you calculate that?<br>-  Well, I'm not crazy to give her 7, I will give her 1 and have 19 left.`},
          {q:`A second grader asks his grandma:<br>- Grandma, what time is it?<br>-  It’s ten to six, sweetheart.<br>- So, it’s six minus ten… that’s four! Time for the park!`},
          {q:`The teacher asks Chris:<br>- Chris, who did your homework?<br>- I don't know, miss, I left my notebook at my grandma's house and there were five people there, it could have been anyone…`},
          {q:`During maths class, the teacher tells Tony:<br>- Tony, stop whistling while you are solving problems!<br>- But I'm not solving problems, miss, I'm just whistling.`},
          {q:`At dinner, the child asks his dad:<br>- Dad, why can't we watch TV while eating?<br>- Because the TV doesn't like watching people eat, son.`},
          {q:`A mum asks her son:<br>- Why are you reading your history textbook upside down?<br>- What does it matter, mum? It's all in the past anyway...`},
          {q:`Grandpa tells his grandson:<br>- When I was little, we had to walk 5 kilometres to school.<br>The grandson replies:<br>- Well, grandpa, two years ago it only took me 5 clicks to get to the online school!`},
          {q:`A mum asks her child:<br>- How was your day at school?<br>- Amazing, mum! I won an award for being the quietest and slowest reader!`},
          {q:`At school, the teacher asks:<br>- Who can tell me what the smallest number is?<br>Little Ben speaks up:<br>- My maths grade, miss!`},
          {q:`A child asks his dad:<br>- Dad, why do you always call me your little star?<br>Dad replies:<br>- Because every night you are shining bright when it's bedtime, and every morning you are out like a light when it's time to wake up!`},
          {q:`A music teacher asks the kids:<br>- What's an orchestra?<br>Little Harry replies:<br>- It's a group of people who play music together while the conductor waves a stick so they don't fall asleep!`},
          {q:`A teacher asks Alex:<br>- Alex, if you have 10 apples and I give you 5 more, how many will you have?<br>- Ten, miss - I only like bananas!`},
          {q:`A first grader comes home after his first day at school, and his mum asks him:<br>- How was your day, Marty?<br>- Great, but I don't think I'll go back tomorrow.<br>- Why not?<br>- Because I've already learned everything I have to know!`},
          {q:`A student asks the maths teacher:<br>- Miss, if I have 5 apples in one hand and 6 in the other, what do I have?<br>- Big hands, Bill!`},
          {q:`A kid asks his mum:<br>- Mum, if I behave, will you buy me a toy?<br>- Of course, sweetie.<br>- Great! Because if you don't, I'm gonna be bad!`},
          {q:`A teacher asks her students:<br>- Who can tell me where the penguins live?<br>Tony proudly raises his hand:<br>- On YouTube, miss! I've seen them there on my phone!`},
          {q:`A child comes home from school and says to his mum:<br>- Mum, today we've learned that the Earth revolves around the Sun.<br>- And how do you feel about that?<br>- A bit dizzy, mum... from all that spinning!`},
          {q:`A boy tells his dad:<br>- Dad, when I grow up, I want to be a scientist.<br>- That's great, son! In which field?<br>- The field of holidays!`},
          {q:`The teacher asks Max:<br>- Max, name an animal that starts with the letter "M".<br>- My cat!`},
          {q:`A little boy talks to his dad:<br>- Dad, why do people say some folks are wise like owls?<br>- Because, same as owls, they stay up all night thinking about weird stuff like theorems and problems.`},
          {q:`Grandma asks her grandson:<br>- What's the hardest part of school?<br>- Waking up in the morning, grandma.`},
          {q:`A mum asks her son:<br>- Liam, do you know why broccoli is good for your brain?<br>- Because it makes your brain think really hard... about how to avoid eating them again!`},
          {q:`Little Sam asks his grandma:<br>- Grandma, why do you sometimes talk to yourself?<br>- So, I can hear something sensible once in a while, sweetheart!`},
          {q:`A kid complains to his mum:<br>- Mum, why do I have to study history? It already happened!<br>- So, you don't repeat the mistakes of those before you - like not picking up your toys!`},
          {q:`The maths teacher asks the class:<br>- If you have 10 chocolate bars and someone takes 5, what will you do?<br>- I'll cry, miss! - shouts Sam.`},
          {q:`A father says to his daughter:<br>- You know, when I was your age, I was an excellent student in every subject.<br>- Yeah, and you always say, "Back in my school days everything was easier"! Well, it was easier for you - not like now!`},
          {q:`A child asks his grandpa:<br>- Grandpa, why do you wear glasses?<br>- So, I can see better, Marty.<br>- Then why can't you ever see the remote control?`},
          {q:`A mum asks her son:<br>- Why did you write in your homework that the cow is the most important animal?<br>- Because it gives us milk, chocolate, and ice cream, mum!`},
          {q:`Dad is looking through a family album with his kids:<br>- Dad, who's that guy with the big beard in the picture?<br>- That's me, before I met you.<br>- And what happened next?<br>- I shaved — you kept getting poked when I hugged you.`},
          {q:`A mother explains to her daughter why she should brush her teeth:<br>- If you don't brush your teeth, they will turn yellow with brown spots.<br>- Oh, that's what happened to the bananas!`},
          {q:`Grandma tells her grandson:<br>- Tommy, if you eat all your vegetables, you will have lots of energy and be healthy!<br>- Grandma, I'm saving them for you - you said you were tired!`},
          {q:`Dad asks his son:<br>- Why did you put the cat in the fridge?<br>- I wanted to see if it still has nine lives when it's cold, dad!`},
          {q:`A dad is fishing with his kids:<br>- Dad, put the worm on the hook for me!<br>- Dad, I got my shoe wet!<br>- Dad, where's the bottle of water?<br>- Dad, is there anything else to eat?<br>- Dad, you are on a roll today!<br>- Dad, why are you such a good fisherman?<br>- Because the fish gets curious about who this "Dad, Dad, Dad, Daaad..." guy is and bites the hook just to see me.`},
          {q:`Two brothers are talking:<br>- Bro, I've got a superpower!<br>- What is it?<br>- I can make the fridge light up just by looking at it!<br>- It's the automatic sensor, mate...`},
          {q:`A mother says to her daughter:<br>-  You shouldn't eat ice cream before lunch.<br>- Then I'll just eat it as lunch!`},
          {q:`Grandma says to her grandchild:<br>Georgie, when I was a child, we didn't have the Internet.<br>- How did you live, grandma?<br>- We played outside, child.<br>- How do you download this app from the Internet, grandma?`},
          {q:`A mother is shopping at the grocery store with her 9-year-old son.<br>At the checkout, the boy decides to add a toy egg, after he had already been picking two chocolate bars, a carton of juice, a cupcake...<br>- You've already bought enough "rewards", leave the egg!<br>- Mum, please, this is new, I haven't tried it yet! - The boy looks sadly at his mother.<br>-No, I'll buy it some other time. Let's go! Take this bag and help me!<br>- No! I will help you, but some other time!`},
          {q:`March the 8th is approaching. A mother asks her son:<br>- What should we get for your grandma as a gift for this holiday? I want to give her something that will make her really happy.<br>- Oh, a new football will make her very happy! Grandma's always so happy when I'm happy!`},
          {q:`A teenager comes home and asks:<br>- Mum, what did you cook today?<br>- Nothing, sweetheart!<br>- But yesterday it was "nothing" too!<br>- Well, I cooked for two days!`},
          {q:`Sunday morning, 6:40 am. The child walks into the parent's bedroom:<br>- Come on, mum, it's time to get up!<br>- It's Sunday, let me sleep in!<br>- I ask you the same when you wake me for school, but you don't let me sleep! Come on, get up, please, don't make me come ten times - you will be late for pancakes.`},
          {q:`At the beach, kids are playing near the towels of two makeup-heavy ladies enjoying a child-free cocktail break. Annoyed, one of the women complains to nearby parents:<br>-  Please, take your child - it's too loud!<br>- Madam, that's not my child - says the father, mine is the one quietly pouring sand into your cocktail.`},
          {q:`Hide and seek is such a useful game - dad tells the mum.<br>- Why?<br>- While playing with the kids, I found 5 EUR under our bed, 3 socks, and the second car key I've been looking for a month...`},
          {q:`Grandma asks her 8-year-old grandson, who's spending the summer vacation with her in the village:<br>- Why did you pour salt by the doors?<br>- So, the zombies don't come in, grandma!<br>- But there are no zombies here!<br>- Well, there aren't any because I've added salt!`},
          {q:`10-year-old Mary asks her mum:<br>- Mum, can I invite Emma to sleep over tonight and have a pyjamas party?<br>- Of course, sweetheart, I would love for you two to have fun. Just please fold your laundry, clean your room, and put fresh sheets on the other bed first.<br>Mary quickly calls Emma.<br>- Emma, unfortunately, you can't come over tonight! Mum said no.`},
          {q:`A fifth-grade girl is late for her first class. The teacher asks:<br>- Why are you late?<br>- I was trying to convince mum this morning to let me stay with her today. She's going shopping for new clothes.<br>- Your mum is right - school is more important!<br>- No, mum said there's not enough money for both of us to get clothes.`},
          {q:`A mother decides to check if her son is studying history. She enters his room, and gets angry:<br>- Why are you upsetting me? Instead of studying, you are playing on the computer!<br>- Mum, to keep you from getting upset, knock first, count to five, and then come in. That way I will have time to close the game and put the textbook in front of me.`},
          {q:`A teacher scolds two cousins who are in the same class:<br>- John, your essay on "My winter vacation" is exactly the same as your cousin Emma's. You copied it!<br>- No, madam, we have been together during the winter vacation, the same things happened to both of us!<br>- Then next time write your essay from a boy's perspective?`},
          {q:`A mother asks her six-year-old daughter:<br>- What will you buy with the money you got from the Christmas carolling?<br>- I will buy five identical white dresses.<br>- Why do you need the same dress five times?<br>- So, I can get dirty and you won't stop me! I will just say, "Relax, I have another one" every time you don't let me play in the sandpit wearing it.`},
          {q:`On an airplane, a passenger calls the flight attendant:<br>- Madam, can you please change my seat? There's a child next to me who won't stop asking questions, poking me with his elbow, and yelling while I'm trying to sleep.<br>- I'm sorry, sir, but we can't. Parents must sit next to their children during the flight.`},
          {q:`A teacher gives the class a short essay with topic: "What does the school of my dreams look like"?<br>All the children hand in one page. Only Tom submits a blank sheet.<br>- Tom, why didn't you write anything?<br>- My dream school is invisible, madam! It can’t be seen; how can I describe what it looks like?`},
          {q:`A police officer stops a car driving without its headlights on. He introduces himself and sees that the driver is his former school teacher:<br>- Good afternoon, Ms. Smith! Now go home and write neatly 100 times: "I will never drive without headlights off again"!<br>- Alright, Peter, I'm going!`},
          {q:`A father and son enter the emergency room. The child has red and swollen fingers on his right hand.<br>- What have you done? - asks the doctor.<br>- A bird feeder - replies the child.<br>- And your fingers?<br>- I was holding the nails to keep them straight, and dad was hammering them into the boards.`},
          {q:`Two crying boys run to their mother. The mother asks the younger one first:<br>- What is it this time?<br>- My brother killed a fly really hard with the swatter while it was sitting on my head.<br>- And why is he crying?<br>- Because my reflexes work really well, the nerve in my knee got triggered and I kicked him really hard.`},
          {q:`A mother tells her 7-year-old daughter:<br>- Please tidy up these toys, they are scattered all over the room.<br>- Mum, I already tidied them two days ago and there was no result! They are very disobedient; I won't deal with them every day!`},
          {q:`- Son, why do you always tuck your sweatshirt into your tracksuit, and your tracksuit into your socks?<br>- Because that way people won't have high expectations of me, and I can calmly do whatever I want.`},

      },
      {
        id: `top_secrete_en`,
        title: `Top Secrets for School Success`,
        icon: `🍀`,
        type: `rules`,
        items: [
          {title:`Always be prepared for school!`,examples:[
            `Example: Get your books ready for school in the evening.`,
            `Example: Always check if you have all your homework tasks done for the next day.`,
            `Example: Make sure you have everything necessary for school - pencils, rubbers, rulers, etc.`
          ]},
          {title:`Pay attention in class and participate actively.`,examples:[
            `Example: Listen carefully when the teacher explains.`,
            `Example: Answer the teacher's questions.`,
            `Example: Participate in different discussions and projects.`
          ]},
          {title:`Have your homework done in time and diligently.`,examples:[
            `Example: Spend some time every evening for your homework.`,
            `Example: Check if you understand the lesson while you're doing your homework.`,
            `Example: Request for help or ask questions if you don’t understand the tasks.`
          ]},
          {title:`Be organised and tidy with your study books.`,examples:[
            `Example: Organise your study books in subjects.`,
            `Example: Keep your notebooks and textbooks in good condition.`,
            `Example: Keep your desk clean and tidy.`
          ]},
          {title:`Respect your teachers and classmates.`,examples:[
            `Example: Listen and don’t interrupt others while they are speaking.`,
            `Example: Be kind when you argue or express your opinion.`,
            `Example: Help your classmates when they have difficulties.`
          ]},
          {title:`Be punctual and don’t be late for class.`,examples:[
            `Example: Leave home on time.`,
            `Example: Be in the classroom before the school bell rings.`,
            `Example: Go back to class quickly after each school break.`
          ]},
          {title:`Participate in extracurricular activities.`,examples:[
            `Example: Join a school club or sports team.`,
            `Example: Participate in school activities and performances.`,
            `Example: Help with the organisation of school activities.`
          ]},
          {title:`Set goals and work hard to accomplish them.`,examples:[
            `Example: Set a goal to improve your grades in maths or any other subjects.`,
            `Example: Participate actively in different discussions.`,
            `Example: Set goals to participate in a sports competition or Olympiads.`
          ]},
          {title:`Learn how to manage your time effectively.`,examples:[
            `Example: Plan your study and play time.`,
            `Example: Do the homework tasks on time.`,
            `Example: Save some time for relaxation and fun.`
          ]},
          {title:`Preserve your curiosity and desire for learning.`,examples:[
            `Example: Read a book or a comic book.`,
            `Example: Ask questions when you want to know something.`,
            `Example: Participate in competitions and challenge your abilities.`
          ]}
        ]
      },
      {
        id: `puterea_increderii_en`,
        title: `The Power Is in You, When You Have Confidence!`,
        icon: `💪`,
        type: `rules`,
        items: [
          {title:`Say "I can!" instead of "I can't!"`,examples:[
            `Example: If you're struggling with a tough homework assignment, say "I can do it!" instead of "This is too hard for me!"`,
            `Example: Before a sports day, think "I can do well in these games!" even if you feel nervous.`,
            `Example: When learning something new, like riding a bike, tell yourself "I can learn this!"`,
            `Do you remember the last thing that scared you and you thought you couldn't do it? Do you remember the success and the joy when you managed to do it?`
          ]},
          {title:`Smile at yourself in the mirror and say "Today it will be a great day!"`,examples:[
            `Example: In the morning, after brushing your teeth, look at the mirror, smile and say it.`,
            `Example: If you have a test at school, smile and tell yourself you will do well.`,
            `Example: Before your birthday, smile and say the day will be unforgettable and fun.`,
            `Our thoughts are magical! Thoughts can transform the world around us - just like tuning a radio until you find the music you like.`,
            `We choose what to think! Think about the good things you've already achieved!`
          ]},
          {title:`Learn how to accept compliments by saying "Thank you!"`,examples:[
            `Example: If someone says your drawing is beautiful, say "Thank you!" and smile.`,
            `Example: When your teacher praises your homework, say "Thank you, I tried hard."`,
            `Example: If your grandmother says you helped a lot at home, reply with "Thank you, I'm glad I could help."`
          ]},
          {title:`Find something you're good at and do it every day!`,examples:[
            `Example: If you love to draw, set time aside each day for drawing.`,
            `Example: If you're good at maths, help your friends with their homework.`,
            `Example: If you like to sing, sing every night before bed. Everyone can sing! It doesn't matter how others judge your songs (nice, off-key, bad) - if you want to sing, sing!`
          ]},
          {title:`Learn to say "no" to things you don't like!`,examples:[
            `Example: If you don't want to play a certain game in the playground, say "No thanks, I'd prefer a different game."`,
            `Example: If you're offered food you don't like, refuse politely.`,
            `Example: If a friend suggests doing something you know is wrong, say "No, I don't think that's a good idea."`
          ]},
          {title:`Help others!`,examples:[
            `Example: Help a younger sibling get dressed or ready for school.`,
            `Example: Help a classmate who is having trouble with the lessons.`,
            `Example: "Lend a hand" to an elderly person carrying heavy groceries.`
          ]},
          {title:`Learn from your mistakes!`,examples:[
            `Example: If you get a low grade on a test, figure out where you went wrong and try not to repeat it.`,
            `Example: If you break something at home, take responsibility and think about how to be more careful next time.`,
            `Example: If you argue with a friend, think about how to improve communication next time.`
          ]},
          {title:`Share your successes and happy moments with your parents, grandparents, teachers and friends!`,examples:[
            `Example: When you’ve helped someone.`,
            `Example: When you’ve learned a new skill or started a new hobby.`,
            `Example: When you’ve overcome a fear.`
          ]},
          {title:`Think positively!`,examples:[
            `Example: If it's raining and you can't play outside, think about how you can have fun indoors.`,
            `Example: If you feel lonely, think about your family and all the friends who love you.`,
            `Example: If you make a mistake, think about how it makes you stronger and smarter.`
          ]},
          {title:`Show your emotions and talk about them!`,examples:[
            `Example: If you're feeling sad, share it with someone in your family.`,
            `Example: If you're happy about something, share your joy with others.`,
            `Example: If you feel disappointed, ask someone in your family for support or advice.`
          ]}
        ]
      },
      {
        id: `bunele_maniere_en`,
        title: `Good Manners`,
        icon: `🎩`,
        type: `quiz`,
        items: [
          {q:`When someone wakes you up in the morning, what do you say?`,opt1:`"Good morning! Thanks for waking me up. I'm getting up."`,opt2:`"Ugh, I'm not getting up now! A beaver just gave me some chocolate. I'm going to eat."`},
          {q:`What should you do before leaving the house in the morning?`,opt1:`Brush my teeth and put on clean clothes.`,opt2:`Check if my elephant is still sleeping in the wardrobe.`},
          {q:`Why is it important to brush our teeth in the morning and evening?`,opt1:`To keep our teeth clean and healthy.`,opt2:`To use up the toothpaste faster and mess up the sink.`},
          {q:`What should you do first when you get home?`,opt1:`Wash my hands with water and soap.`,opt2:`Check if the cookies on the table are coated with chocolate at the bottom.`},
          {q:`What should you do if you see someone has fallen and hurt themselves?`,opt1:`I should help or find an adult who can help.`,opt2:`Check if they dropped any candies on the ground.`},
          {q:`What do you do when someone is talking to you?`,opt1:`I listen carefully and don’t interrupt them.`,opt2:`I pretend to be a space monster and respond with growls.`},
          {q:`Why is it important to tidy up your toys after playing?`,opt1:`So, it's organized and we don't trip over anything.`,opt2:`Because the toys get upset if we leave them messy and start planning a rebellion.`},
          {q:`What do you do when you're a guest at someone's house?`,opt1:`I behave politely and follow the host's rules.`,opt2:`I play hide and seek and hide in the fridge.`},
          {q:`Why should we wash our hands before eating?`,opt1:`So, we don't put germs and bacteria in our mouths.`,opt2:`So, we don't turn into superheroes with microbic powers.`},
          {q:`Why should we listen carefully to the teacher?`,opt1:`So, we can learn new things and do well in school.`,opt2:`Because if we don't listen, teachers might turn into robots and start singing opera.`},
          {q:`What do you do when a classmate helps you with homework?`,opt1:`I thank them and promise to help when they need it.`,opt2:`I make them a pasta statue and call it "The Homework Saviour."`},
          {q:`Why is it important to pay attention in class?`,opt1:`So, I understand the lesson and study less at home.`,opt2:`So, I don't miss the moment someone may.`},
          {q:`What do we do if we don't understand something during class?`,opt1:`We ask the teacher for an explanation or repetition.`,opt2:`We send a message to the aliens for help.`},
          {q:`Why should we share toys with our friends?`,opt1:`To learn to share and be good friends.`,opt2:`It's not important because mum doesn't share her money and car with her friends either.`},
          {q:`What should you do when the teacher is explaining a new lesson?`,opt1:`I listen carefully and write down the important parts.`,opt2:`I pretend I'm taking notes but actually I'm doodling.`},
          {q:`Why is it important to read the lessons at home?`,opt1:`So, I understand the material and I am prepared for school.`,opt2:`So, grandma can quiz me on maths and history.`},
          {q:`What do you do if a classmate helps you with a difficult task?`,opt1:`I thank them and try to help someone else too.`,opt2:`I give them my lunch as a token of gratitude especially if it's broccoli, beets or Brussels sprouts.`},
          {q:`What should you do during class?`,opt1:`Pay attention and don't chatter.`,opt2:`Check if the teacher is a remote-controlled robot.`},
          {q:`Why is it important to share with your classmates?`,opt1:`So, we learn to be generous and build friendships.`,opt2:`So, we find out who's the best at hiding treats at school.`},
          {q:`What should you do when entering a store?`,opt1:`Stay calm and don't touch everything.`,opt2:`Test all the alarms for safety using songs and dances.`},
          {q:`How should you behave in a restaurant?`,opt1:`Eat carefully and don't throw food.`,opt2:`Hold a contest to build the tallest tower out of napkins.`},
          {q:`What do you do if you see a toy you want at the mall?`,opt1:`Ask your parents if you can have it.`,opt2:`Start crying, then screaming, then rolling on the floor ... until they buy it.`},
          {q:`Why should you stay close to your parents in public places?`,opt1:`So, I don't get lost and stay safe.`,opt2:`So, I'm close by when they decide to buy me ice cream.`},
          {q:`How do we act while waiting in a queue?`,opt1:`We should be patient and not complain.`,opt2:`Pretend we are drunk carrots and spin with arms wide open.`},
          {q:`Why should we hold a parent's hand during a walk?`,opt1:`So, we feel safe and don't get lost.`,opt2:`Because they may get lost and need a superkid like me to guide them.`},
          {q:`What do you do if you like something in a store but mum says she can't buy it?`,opt1:`I understand and don't insist.`,opt2:`I pretend to be a statue next to the item and say that we are one whole and I can leave the store only if I take it with me.`},
          {q:`What should we do after leaving a store?`,opt1:`Thank our parents for the shopping.`,opt2:`Start complaining how hungry, thirsty and tired we are, even though they have bought us 5-6 things just in case.`},
          {q:`How do you greet your grandma when she visits you?`,opt1:`I say: "Hello, grandma! How are you?"`,opt2:`I check if she’s brought some candies in her purse and start rummaging through it.`},
          {q:`What do you say when you call your mum on the phone?`,opt1:`I say: "Hi, mum! How are you?"`,opt2:`2. I say: "Mum, where's my chocolate?"`},
          {q:`How do you say goodbye to your teacher at the end of the school day?`,opt1:`“Goodbye, miss! Thank you for the wonderful day.”`,opt2:`“Bye! Hope you lose our test papers!”`},
          {q:`How do you ask a friend for a favour?`,opt1:`“Could you help me with this?”`,opt2:`“I have a top-secret mission. If you accept the challenge, I’ll give you the scoop later!”`},
          {q:`How do you greet your friends when you meet them?`,opt1:`“Hello! How are you?”`,opt2:`“YO! I’ve been looking all over for you!”`},
          {q:`How do you behave when visiting your grandparents?`,opt1:`I behave politely and help if needed.`,opt2:`I check if grandma has hidden cupcakes under the pillows.`},
          {q:`What do you do when dinner is served while visiting someone?`,opt1:`I wait for everyone to start eating and eat slowly and carefully.`,opt2:`I ask if there’s a special astronaut menu because I don’t eat that stuff.`},
          {q:`How do you react if you're offered food you don't like?`,opt1:`I refuse politely and say thank you.`,opt2:`I say I’m saving room for something tastier.`},
          {q:`What do you do if you want to play with a toy at someone else’s house?`,opt1:`I ask for permission before touching the toy.`,opt2:`I offer a toy exchange with my secret invisible toy.`},
          {q:`How should we behave at the table when we are guests?`,opt1:`Eat carefully and don’t talk with your mouth full.`,opt2:`Don’t decorate your ears with spaghetti.`},
          {q:`What do you do if you need to go to the bathroom while visiting someone?`,opt1:`I ask the host where the bathroom is.`,opt2:`I perform the “bent-over cobra dance” until someone guesses where I need to go.`},
          {q:`What do you do if you have to share a room with someone at a camp?`,opt1:`I respect their personal space and keep things tidy.`,opt2:`I plan to build a pillow fortress and think about how to smear toothpaste on them while they’re asleep.`},
          {q:`What should you do when you're at the beach with your parents?`,opt1:`Listen to my parents and don’t go far into the water.`,opt2:`Look for starfish and convince them to throw a beach star party. Also, I throw sand and seaweed at strangers.`},
          {q:`How should you behave in public places during a vacation?`,opt1:`Stay calm and don’t make (too much) noise.`,opt2:`Look for undercover cat agents. Who knows, they might be out there!`},
          {q:`What will you do if there are camp activities you don’t like?`,opt1:`I will try them out. I might end up liking them.`,opt2:`I pretend my hands are stuck together with the breakfast jam.`},
          {q:`How do you behave at dinner in the hotel during vacation?`,opt1:`I eat politely and don’t play with my food (too much).`,opt2:`I pray the food doesn’t run away from my plate while I’m poking it with my fork.`},
          {q:`What do you do if you see something interesting while on vacation?`,opt1:`I share it with my parents or teachers.`,opt2:`I point and yell loudly, “Look, look, YO!”`},
          {q:`What should you do before jumping into the hotel pool?`,opt1:`Make sure it’s safe and that I won’t hit anyone.`,opt2:`I take a running start, scream and do a cannonball, trying to splash as many people as possible for their entertainment, of course.`},
          {q:`How should you behave at dinner in the camp cafeteria?`,opt1:`Follow the rules and be polite.`,opt2:`Roll bread balls to throw at kids at the table and slurp my tea loudly to “cool it down.”`},
          {q:`What do you do when playing games on the beach with other kids?`,opt1:`Play fair and have fun.`,opt2:`Throw sand in their hair so they turn into sand monsters.`},
          {q:`What do you do if you miss home while at camp?`,opt1:`Talk to my teachers about it or go have fun with friends who help me forget.`,opt2:`Call my mum and say there are ants in my bed, my stomach hurts, and she needs to come and get me immediately.`},
          {q:`What do you do when waiting for the bus with your parents?`,opt1:`Wait patiently and stay close to them.`,opt2:`Perform a tribal chief dance to make the bus arrive faster.`},
          {q:`How should you behave on an airplane during a flight?`,opt1:`Sit calmly in my seat and listen to the flight attendants.`,opt2:`Knock on the window to see if I can scare the clouds.`},
          {q:`What do you do when you get on the subway with friends?`,opt1:`We stay calm and hold on to the handrails.`,opt2:`I organize a contest to see who can stand on one leg and whistle the longest.`},
          {q:`How do you react if you have to stand on your feet for the whole bus ride?`,opt1:`I accept it calmly and stand in a safe spot.`,opt2:`I pretend I'm on a spaceship and move weightlessly left, right, forward, backward... I kick the seat in front of me to entertain its passengers.`},
          {q:`What do you do if there are noisy passengers around you on the bus?`,opt1:`I try to stay calm and read a book.`,opt2:`I organize a contest with them for the best animal impersonations - tigers, monkeys and more.`},
          {q:`What do you do when you arrive at a birthday party at a kids' play area?`,opt1:`I greet the birthday child and give them my gift.`,opt2:`I check if the cake can fly.`},
          {q:`How do you behave when playing birthday games?`,opt1:`I play and have fun with everyone.`,opt2:`I pretend to be a superhero saving the party and ruin all the games.`},
          {q:`What do you do if you're at a family birthday party in a restaurant?`,opt1:`I behave politely and help if needed.`,opt2:`I test all the empty chairs to see if they can withstand a jump-landing.`},
          {q:`How do you react if you're offered food you don't like at a birthday party?`,opt1:`I refuse politely.`,opt2:`I pretend to be an alien who doesn't eat Earth food.`},
          {q:`What do you say when it's time to leave the party?`,opt1:`I thank them for the nice birthday and say goodbye to everyone there.`,opt2:`I tell my parents in front of the hosts, "This party is so boring, let's go - I'm hungry!"`},
          {q:`How do you react if you don't win a birthday game?`,opt1:`I congratulate the winner and still enjoy the game.`,opt2:`I roll around like a bear so everyone looks at me instead of the winner.`},
          {q:`What do you do if someone gets hurt while playing?`,opt1:`We stop the game and get help from an adult.`,opt2:`I disappear so no one thinks I'm to blame.`},
          {q:`How should you behave when playing soccer in the park?`,opt1:`I play fair and follow the rules.`,opt2:`I pretend I'm a soccer star with superpowers and never pass the ball to anyone.`},
          {q:`What do you do if you and your friends can't agree on what to play?`,opt1:`We talk and find a compromise.`,opt2:`I call my mum to tell them to listen to me.`},
          {q:`What do you do if you want to play something but your friends want something else?`,opt1:`I suggest we take turns choosing the games.`,opt2:`I tell them there's a surprise at home if we play my game. The surprise is... there's no surprise!`},
          {q:`How do you react if a friend drops the ball and it ‘flies’ far away?`,opt1:`I’ll help find it together.`,opt2:`I’ll pretend it's a magic ball taking us on an adventure.`},
          {q:`What do you do when you're playing and arguing over the rules?`,opt1:`We try to come to an agreement and play fair.`,opt2:`I scream like a fire engine until they agree with my rules.`},
          {q:`What will you do if someone suggests a dangerous game?`,opt1:`I’ll say no and suggest a safer game.`,opt2:`I’ll tell them their mum installed a listening device in their phone and she'll call soon.`},
          {q:`What will you do if you see a new child who wants to join the game?`,opt1:`I’ll ask my friends, and if everyone agrees, we will invite them.`,opt2:`I’ll try to find out if they're an alien spy and check their ears.`},
          {q:`What do you do when it's time to go home?`,opt1:`I leave on time, as agreed.`,opt2:`I signal a police car and run off.`},
          {q:`What do you do if an argument arises during a game with friends?`,opt1:`I try to resolve the conflict calmly.`,opt2:`I whistle and call a laughter break. I tell a joke from the book "Laughter with kids."`},
          {q:`How should you react if a friend scrapes their knee while running?`,opt1:`I’ll help them and call an adult if needed.`,opt2:`I’ll give them a superhero sticker and state it’s rescue time.`},
          {q:`What will you do if you're playing soccer and the ball goes into someone's yard?`,opt1:`I’ll ask the owner for permission to get the ball.`,opt2:`I’ll make a plan for the mission "Jump over the fence."`}
        ]
      },
      {
        id: `povestile_maniera_en`,
        title: `The Stories of Mannergirl`,
        icon: `🧚`,
        type: `story`,
        items: [
          {title:`MANNERGIRL AND MEANMOUTH`,body:`Once upon a time, in a magical kingdom, where every sunrise was a new beginning, there lived a little elf named Mannergirl. She was the guardian of good manners and cared deeply for the happiness of children. In her colourful kingdom, Mannergirl often thought about the children on Earth who sometimes forgot how important kind words and good deeds were.

One day, Mannergirl felt she had to help a boy known among his classmates as Meanmouth. He was infamous for insulting other kids. Meanmouth teased others because he thought it would make him look stronger.

Mannergirl flew down to Earth and found Meanmouth in the schoolyard, just before he was about to say something mean to another child. The glowing elf landed gently on his shoulder and whispered:

- Hello, Meanmouth! Did you know that every word you say holds power? That power can be used for good or for evil. Your words can be like warm sunrays that brighten people's hearts, or like a cold wind that makes them shrink and run away from you.

Meanmouth looked at Mannergirl in surprise. He had never thought about his words that way.

- How would you feel if someone insulted you? Probably not very good, right? Others feel the same when you hurt them with your words - Mannergirl continued.

- If you start using your words for good, you'll see what a miracle can happen.

The next day, Meanmouth decided to change his behaviour. He started saying kind things to his classmates. Instead of criticizing like he used to, he praised his classmate’s drawing:

- Nice work, Teddy!

Soon, Meanmouth became the School’s Favourite. The children started laughing WITH him, not AT him.

A funny moment happened one day while everyone was playing in the schoolyard. Meanmouth accidentally tripped over a stick and flipped forward like an acrobat. The whole yard burst into laughter and so did he. Meanmouth realized it felt much better to be the reason for joy, not fear.

From that day on, he was no longer called Meanmouth - now he was known as Kindmouth. He had discovered the true power of kind words and how they could change the world. Thanks to Mannergirl the Elf, he learned that real strength comes from kindness and gentleness, not from rudeness or aggression.`,questions:[
              `Do you know someone like Meanmouth?`,
              `What advice would you give them?`
            ]},
          {title:`MANNERGIRL AND TERRIBOY`,body:`In a distant magical kingdom among the clouds, the little elf Mannergirl was going over her list of tasks. She loved helping children become better and happier. Her notebook was full - thousands of children needed her care and attention. One name caught her eye - Terriboy, the “most terrible child,” according to the kids in his class.

Mannergirl soared down to Earth in search of Terriboy - a boy known for his bad behaviour. He kicked his classmates, threw their backpacks, and constantly made fun of them. Every day, the children would complain about him to their teachers and parents.

Mannergirl descended from the clouds and appeared in the schoolyard. She saw Terriboy pulling on another child’s tongue and decided it was time to help him change.

She floated close and said gently:

- Terriboy, did you know that every child is special and can bring happiness to others? You have that power too! You can be a good friend. You can help others and make them smile.

Terriboy was initially surprised by Mannergirl’s words, but they lingered in his mind. The next day at school, he did something unexpected, he helped a little girl pick up her backpack. Then he passed the ball to a younger boy who was too shy to ask for it. He played soccer the entire break without kicking or spitting at anyone.

Soon, everyone noticed the change in Terriboy. He began helping his classmates and being kind to them. The children started to like him and enjoy his company. They included him in their games and always wanted him on their soccer team.

One day, Terriboy raised his arms and said:

- I’ll use my magic to make everyone laugh!

He began making funny faces and walked around like a clown. All the children laughed out loud and Terriboy realized that making people happy felt much better than hurting them.

Thanks to Mannergirl the Elf, Terriboy learned the value of kindness and became friends with all his classmates. He also discovered that every child carries goodness inside. And doing good things brings joy not only to others but to himself as well.

Terriboy became happy…`,questions:[
              `Do you have classmates like Terriboy?`,
              `Could it be... that you sometimes act like him too?`,
              `What would you say to a child like that, to help them change and become better?`
            ]},
          {title:`MANNERGIRL AND GRUMPYBOY`,body:`On a beautiful morning in the distant kingdom of the elf Mannergirl, the sun was shining brightly. Though she was as small as a clover leaf, her heart was as big as the sky. Every morning, she gathered dew from the flowers to prepare her magical elixir of joy.

Far away from her kingdom, in a school on Earth, lived a boy named Grumpyboy. He was known as the school’s eternal grump. Grumpyboy never greeted anyone, never said “Good morning,” and always had a gloomy look on his face.

One morning, as Grumpyboy was walking into class again without saying hello, something unexpectedly happened. Mannergirl appeared and landed gently on his shoulder.

- Hello, Grumpyboy! - she whispered. - Did you know that every word you say can be like a ray of sunshine for someone? When you say “Good morning,” you spread light and warmth around you.

Grumpyboy looked at her with doubt, but there was something magical in Mannergirl’s eyes that made him want to believe her. And so - he did!

The next morning, he gathered his courage and greeted his parents with a soft “Good morning!” They smiled wide and happily returned the greeting. At school, Grumpyboy greeted the security guard, the teachers in the hallway, and even some of his classmates. To his surprise, they all smiled back.

Day by day, Grumpyboy began to change. He realized that words had the power not only to brighten someone else's day but also his own. Mannergirl was watching him from afar, smiling at every little change she saw in him.

Then, one morning, Grumpyboy decided to be even braver. He stood in front of the whiteboard and shouted:

- Good morning, everyone!

The class burst into laughter, not because they were mocking him, but because Grumpyboy had playfully mimicked the teacher’s voice. He had become the class’s cheerful hero, the boy who now often smiled.

From then on, Grumpyboy was no longer the eternal grump. He became the boy who greeted others with a smile and received smiles in return.`,questions:[
              `Do you say “Hello” in the morning?`,
              `Do you greet your teachers, the security guard or the janitors?`,
              `Do you greet your neighbours?`,
              `Do you greet the people working at the store?`,
              `Do you know someone like Grumpyboy?`,
              `Have you ever been like Grumpyboy yourself?`
            ]},
          {title:`MANNERGIRL AND PUNCHER`,body:`On the fourth day of her adventures on Earth, the little elf Mannergirl decided to visit a new place. This time, her mission was to help a boy named Puncher. That day, Mannergirl chose to observe the children closely from a hiding spot among the branches of a big willow tree in the schoolyard.

Puncher was well known at school and in the neighbourhood for getting into fights with other children. He believed that fighting was the only way to show his strength.

One day, just as Puncher was about to get into another fight, the glowing elf Mannergirl appeared beside him.

- Puncher, she began in a calm and gentle voice, - true strength isn’t shown through harshness, but through kindness and courage. You don’t need to fight to be respected or loved.

Puncher looked at her in surprise. Mannergirl’s words made him stop and think.

- Look, - she continued, - real heroes are the ones who use their strength to protect and help others. The courage to be kind is the greatest power of all.

From that day on, Puncher began to see the world differently. He stopped fighting and started helping his classmates instead. Whenever someone needed support, Puncher was there to stand by them and offer a helping hand.

He continued to show his new, kind-hearted side by being there for others and protecting his friends. One day during the break, in the school yard, he decided to do something funny to make everyone laugh.

Puncher found an old, forgotten clown costume in the sports storage room. He quickly put it on and walked out into the yard, performing silly tricks and joking with the others. He made funny faces and even did an unexpectedly hilarious penguin dance, slipping and tumbling in the most comical way.

All the children laughed from the heart and clapped for their new friend. Puncher smiled widely, realizing that laughter and kindness were far more powerful than aggression.

From that moment on, Puncher was known at school not only as a kind person but also as the class clown in the best possible way - funny, joyful, and loved by all.

Thanks to Mannergirl, he had learned that true strength lies in the heart and in the ability to make others smile.

And so, with the help of the little elf, Puncher became a real hero in everyone’s eyes - a hero who knows how to make his friends laugh and protect them.`,questions:[
              `Do you know someone like Puncher?`
            ]},
          {title:`MANNERGIRL AND ENVIELLA`,body:`In a school where different adventures happened every day, there was a little girl named Enviella. She was always envious of the other children's toys, clothes and shoes. Every new thing she saw made her want to have the same thing.

One day, while Enviella was dreaming about other people's toys again, the elf Mannergirl flew and landed next to her. Then, she whispered:

- Enviella, the true value is not in the things you own.

Your uniqueness and your heart are your greatest treasures. Love what you have and you will see how special it is.

Enviella thought about the words of Mannergirl and soon realized that the elf was right. She began to appreciate her own belongings, seeing them in a new light. Her shoes now seemed to her like wonderful treasures, full of adventures and memories.

The next day, while all the children were playing in the yard, Enviella decided to tell her friends about her meeting with Mannergirl. She began to spin and dance in her “wonderful shoes”. At that moment, a curious kitten who had come to the school jumped up and started playing with the laces of her shoes. Enviella tried to dance with the kitten, but she tripped and fell on the grass, laughing heartily along with the other children.

Everyone laughed at the funny scene, and Enviella realized that the real joy comes from sharing moments of happiness and laughter. She learned that happiness did not lie in possessing things, but in the ability to enjoy the moments and appreciate what you have.

Since then, Enviella has become known at school for her cheerful mood and ability to find happiness in the little things. Thanks to Mannergirl, she has learned that every child is unique and special in their own way.`,questions:[
              
            ]},
          {title:`MANNERGIRL AND DISRESPECTO`,body:`In the magical kingdom of the clouds, where elves dance among the stars, lived the little elf Mannergirl. She often worried about the children of Earth, especially those who forgot the meaning of respect and discipline. Mannergirl knew that respect for teachers was key to the success and development of every student.

Among these children was the boy Disrespecto. At school, Disrespecto often ignored maths lessons. Not only did he refuse to pay attention to his teacher, but also, he did not respect him. The boy was either talking to his classmates during classes or playing on his phone, and often his answers were full of arrogance.

One day, during a maths lesson, while Disrespecto had his feet up on his desk, the elf Mannergirl appeared next to him. Shining like a morning star, she sat on his shoulder and whispered:

- Disrespecto, do you know that respect and attention can unlock the doors of knowledge and success? When you respect your teacher, you respect your future. Every lesson is an opportunity to learn something new. Besides, studying is like gymnastics for the brain - the more you practise, the faster and stronger your mind will be!

These words left a deep impression on Disrespecto's heart. He realized that his behaviour was not only preventing him from learning, but also making it difficult for the teacher and the other students.

From the next day, Disrespecto began to change and train his brain. He listened attentively during lessons, asked questions, and actively participated in discussions. Soon, his grades improved and he began to find pleasure in learning.

His parents and teacher noticed the change and praised him. The teacher even awarded him a special prize for the most successful student of the month.

Disrespecto got distracted and accidentally wrote 10 with another zero - 5+5=100.

Everyone in the class burst into laughter. Disrespecto quickly “inserted” two eyes and a smile into the zero, and the zero turned into a smiling man. Thus, the boy made his teacher laugh too. Disrespecto realized that learning can be fun.

Since then, Disrespecto has become a role model for other students. He has learned that respecting teachers and learning are important steps to success.

Thanks to Mannergirl, Disrespecto discovered the joy of learning and the importance of respect.`,questions:[
              `One day the teacher asked Disrespecto to go to the board to solve a problem: 5+5 =?`
            ]},
          {title:`MANNERGIRL AND DORY`,body:`In a magical kingdom where elves weave dreams and create miracles, the elf Mannergirl was spending her days caring for the kindness and hearts of children. She was often worrying about the children of Earth, especially those who did not know the meaning of friendship and kindness.

In a school on Earth, in the second grade, there was a little girl named Dory. Dory was a very kind and quiet child, always ready to help and participate in class. However, the other girls in the class decided to isolate her.

They did not invite her to their games and avoided her during breaks. Dory felt very lonely. Dory started playing soccer with the boys, so that she would have someone to have fun with.

One day, when the girls once again excluded Dory from their games, someone arrived unexpectedly-Mannergirl. She flew down and landed on one of the trees in the schoolyard and spoke to the girls:

- Hello, dear children! Do you know that every child is unique and interesting? When you leave someone out of your games, you miss the chance to learn something new and exciting about that person.

The girls listened attentively, while Dory was standing away, surprised by the appearance of this little elf.

Mannergirl continued:

- Each of you is special and everyone deserves to be part of the group. Just think how many more funny games and adventures you could have together!

After hearing Mannergirl's words, the girls realized their mistake. They invited Dory to join them and she happily accepted.

As they were having fun, a small, bright red object landed on Dory's nose. Everyone stopped and stared - it was a little ladybird, as if dancing on Dory's nose.

Dory crossed her eyes, trying to see the ladybird and began walking around like a juggler trying to balance a ball on his nose. The girls burst into a loud laughter, watching Dory spin around trying not to lose her new friend. Soon, even Dory laughed, as the ladybird finally flew off and landed on one of the nearby flowers.

Their laughter caught the attention of the other students and teachers, who couldn't help but smile at the cheerful scene. This little, unexpected event with the ladybird helped everyone realize how wonderful it is to share joy and laughter with others.

From that day on, Dory and the other girls became good friends and always remembered the day the ladybird brought them so much joy and laughter. They learned that the true value of friendship lies in shared joy and mutual respect.`,questions:[
              
            ]},
          {title:`MANNERGIRL AND THE BOYS FROM SECOND GRADE`,body:`In a magical kingdom, where elves used to care about the nature and the beauty of the world, there lived the little elf Mannergirl. She often worried about the children on Earth, especially those who didn't appreciate cleanliness. Mannergirl knew that cleanliness and respect for nature were essential for a good life.

At a school on Earth, a group of second-grade boys were having fun and eating during the break. After finishing their wafers, they threw the wrappers onto the schoolyard. One child tossed a yogurt cup and kicked it toward the nearby grass. On their way back to class, the boys kicked several doors and even drew an arrow on one of the hallway walls. They were laughing and playing, without thinking about the consequences of their actions.

One day, while the boys were once again throwing wrappers and empty bottles onto the grass, Mannergirl flew down to them. She landed on a bench under the willow tree in the schoolyard and spoke to the boys:

- Hello, boys! Did you know that every action you take leaves a mark on our beautiful world? When you keep things clean and take care of the environment, you help nature.

The boys stopped and listened carefully to the strange little elf. Mannergirl continued:

While they were talking, a teacher went to the principal and told her what the children had done. The principal decided it was time for a little punishment. She ordered the boys to clean the entire schoolyard and the grassy area around the school.

While cleaning, one of the boys accidentally spilled a cup of yoghurt all over his shoes. Everyone burst out laughing as he was trying to wipe off the white, sour-smelling mess from his shoes. This funny moment helped them realize that teamwork could also be fun and that messes aren’t pleasant for anyone, even themselves.

The boys decided to take Mannergirl's advice seriously. They began to take care of their school and respect cleanliness and nature. They understood that every action they take has meaning and consequences. They realized that following the rules in school is their responsibility as students.

Thanks to Mannergirl's lessons and the funny incident with the yoghurt, the boys learned how important it is to keep their school clean and orderly.`,questions:[
              `- Every wrapper you throw, every footprint, every scribble on the wall takes away from the beauty of your school. It spoils the view for your teachers and your parents. Don't your mothers’ love cleanliness and beauty?`,
              `Have you ever thrown wrapping papers in the schoolyard? And on the street?`,
              `What would you do if you saw a child in front of you throwing his breakfast paper in the yard?`
            ]},
          {title:`MANNERGIRL VISITS JOHN AND ANNIE`,body:`In a magical kingdom where every day was filled with wonder and enchantment, the little elf Mannergirl carefully watched over the children on Earth. She often worried about those who forgot to help at home and left everything to their parents.

In a modest home, 8-year-old John and his 12-year-old sister Annie often ignored their household responsibilities. They didn’t want to tidy up their room or closet, fold their laundry, or even help set the table. They left it all to their mother, who was often exhausted from the endless housework.

One evening, while their mum was once again preparing the dinner and John and Annie were playing on their tablets, Mannergirl appeared. She flew in like a beam of light through the window and landed on John's shoulder.

- Hello, John and Annie! - she whispered. - Did you know that helping at home can be fun and bring joy? Everyone can contribute to making home a cosy place.

The children stared at her in amazement. Mannergirl continued:

- Why don't you try turning chores into a game? You could race to see who sets the table faster or who folds the laundry more neatly. Every bit of help you give will make your mum happy and teach you responsibility and care. That way, she will have more time to have fun and talk with you.

The next day, John and Annie decided to give it a try. They set the table while racing each other to see who could place the cutlery faster. In his hurry, John accidentally knocked over a plate, which rolled across the floor like a frisbee. It was spinning and spinning until it stopped right at their mother's feet.

Instead of getting angry, their mum burst into laughter, and soon all of them were laughing together.

Next, while folding laundry, Annie made a little house out of a duvet cover, and Jhon snuck inside and pretended to be a ghost. They had so much fun while helping and realized that housework could become a wonderful game.

Over time, John and Annie became more and more responsible and started helping their mum without asking. They learned that even small gestures bring joy to parents.

Thanks to Mannergirl, John and Annie realized that helping at home isn’t just a chore, but a way to show love and respect for their family. They learned to appreciate their mother's efforts and to care about their home with joy.`,questions:[
              `Do you help at home?`,
              `What’s your favourite household chore?`,
              `Which household task do you find the hardest?`
            ]},
          {title:`MANNERGIRL AND THE SISTERS WHINELLA, LAZELLA, MEANORA`,body:`In the distant, magical Kingdom of the Clouds, the little elf Mannergirl watched over the children on Earth. She was the guardian of good manners and always cared about their happiness and kindness. From her kingdom, she noticed three sisters Whinella, Lazella, Meanora who were in need of her help.

Whinella, the youngest, always wanted everything to go exactly the way she imagined. At school, she refused to cooperate with other children, and at home, she would pout if she didn’t get exactly what she wanted.

Lazella, the middle sister, constantly neglected her responsibilities. She didn't help with housework and skipped her school tasks.

Meanora, the oldest, spoke badly about her classmates behind their backs and spread rumours.

One evening, while the girls were visiting their grandmother, Mannergirl appeared before them. She decided to speak with each sister individually. Mannergirl told them about the power of kind words, effort, and true friendship.

To Whinella, she said:

- Do you know, dear Whinella, that when we think of others, everyone feels happier? Sharing and being kind is the best thing in the world!

To Lazella, Mannergirl whispered:

- Even the smallest effort can bring great joy, Lazella. When you help, you show people they matter to you, and they return that kindness.

And finally, to Meanora, she said:

- True friends say kind things, Meanora. When you say good things, everyone's hearts begin to shine.

After that meeting, the sisters began to change. Whinella became more considerate, Lazella started helping actively, and Meanora changed her way of speaking and made true friends. At school, their teachers and classmates noticed the change and began to like and respect them.

In the end, to show their new attitudes, the sisters organized a fun performance at school. In the play, they acted out their "bad" personalities and made fun of the characters they used to be. They became the "stars" of the stage while laughing at their past flaws. Everyone laughed wholeheartedly.

From that day on, the sisters kept doing what Mannergirl had advised. They became a positive example for their classmates and were praised by everyone for their new qualities. In the end, everyone learned that being kind and thinking of others brings happiness to yourself too.`,questions:[

function renderCards() {
  const s = curBook.sections[curSec];
  const col = curBook.color;
  const cards = document.getElementById('cards');
  if(!cards) return;
  cards.innerHTML = s.items.map((item, i) => {
    if(s.type === 'qa') {
      const done = revealed.has(i);
      return `<div class="qa-card">
        <div class="qa-num">Nr. ${i+1}</div>
        <div class="qa-q">${item.q}</div>
        ${item.a
          ? `<button class="qa-btn${done?' rev':''}" data-qi="${i}">${done?'✅ '+item.a:'🔒 Arată răspunsul'}</button>`
          : '<div style="font-size:11px;color:#ccc;font-style:italic">Asta e doar pentru distracție!</div>'
        }
      </div>`;
    }
    if(s.type === 'rules') {
      return `<div class="rule-card">
        <div class="rule-title"><span class="rule-badge" style="background:${col}">${i+1}</span><span>${item.title}</span></div>
        ${item.examples.map(ex => `<div class="rule-ex">${ex}</div>`).join('')}
      </div>`;
    }
    if(s.type === 'quiz') {
      return `<div class="quiz-card">
        <div class="quiz-num">Nr. ${i+1}</div>
        <div class="quiz-q">${item.q}</div>
        <div class="quiz-opt"><b>1.</b>${item.opt1}</div>
        <div class="quiz-opt"><b>2.</b>${item.opt2}</div>
      </div>`;
    }
    if(s.type === 'story') {
      return `<div class="story-card">
        <div class="story-title">${item.title}</div>
        <div class="story-body">${item.body.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div>
        ${item.questions.map(q => `<div class="story-q">${q}</div>`).join('')}
      </div>`;
    }
    const isJokes = s.id && s.id.startsWith('vicove');
    const isEnglish = s.id && s.id.endsWith('_en');
    let fmtQ = item.q;
    if (!isEnglish) fmtQ = fmtQ.replace(/„/g, '').replace(/"/g, '');
    fmtQ = fmtQ
      .replace(/:\s*(\d+\.)/g, ':<br>$1')
      .replace(/\.\s*(\d+\.)/g, '.<br>$1')
      .replace(/([!?:.…]) — /g, '$1<br>— ')
      .replace(/(Regula \d+:[^.]+\.)\s*/g, '$1<br>')
      .replace(/(Exemplu:[^.]+\.)\s*/g, '$1<br>')
      .replace(/([!?.])\s*(Părinte:|Copil:|Mama:|Tata:|Profesor\w*:|De ce este important:|Exemplu:)/g, '$1<br>$2');
    if (isJokes) {
      // Remove — before speaker labels (Copil: text → Copil:)
      fmtQ = fmtQ.replace(/<br>— ([A-ZĂÂÎȘȚa-zăâîșț]+(?:\s+[a-zăâîșț]+)?:)/g, '<br>$1');
      // Add — after speaker labels before their speech (Copil: text → Copil:<br>— text)
      fmtQ = fmtQ.replace(/:\s+([A-ZĂÂÎȘȚa-zăâîșț])/g, ':<br>— $1');
    }
    return `<div class="list-card">
      <div class="list-num" style="background:${col}22;color:${col}">${i+1}</div>
      <div class="list-txt">${fmtQ}</div>
    </div>`;
  }).join('');
  cards.addEventListener('click', e => {
    const btn = e.target.closest('[data-qi]');
    if(!btn || btn.classList.contains('rev')) return;
    const i = parseInt(btn.dataset.qi);
    revealed.add(i);
    btn.classList.add('rev');
    btn.textContent = '✅ ' + curBook.sections[curSec].items[i].a;
    updateProgress();
  });
  updateProgress();
}

function updateProgress() {
  const s = curBook.sections[curSec];
  const qa = s.items.filter(x => x.a);
  if(!qa.length) return;
  let cnt = 0;
  s.items.forEach((_,i) => { if(revealed.has(i)) cnt++; });
  const pct = Math.round(cnt / qa.length * 100);
  const pf = document.getElementById('pf');
  const done = document.getElementById('rdone');
  if(pf) pf.style.width = pct+'%';
  if(done) done.textContent = pct===100 ? '🎉 Bravo! Ai descoperit toate răspunsurile!' : cnt+' din '+qa.length+' descoperite';
}
