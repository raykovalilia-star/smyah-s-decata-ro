      {
        id: `bancuri2`,
        title: `Bancuri`,
        icon: `😂`,
        type: `list`,
        items: [
          {q:`Copilul are două responsabilități față de mama lui:<br>1. Să o liniștească atunci când este nervoasă.<br>2. Să o enerveze atunci când este liniștită.`},
          {q:`Profesorul întreabă:<br>–George, cum poți să scrii că rândunelele s-au aliniat ca niște mici pe fire?<br>–Păi... îmi era foame!`},
          {q:`O mamă îi spune fiului ei:<br>–Ți-am pregătit o salată de sfeclă roșie și chiftele cu brânză tofu. Să îți pregătesc și altceva?<br>–Da, pregătește-mi și rucsacul! Mă duc la bunica!`},
          {q:`Tata gătește ouă și îi spune cu mândrie mamei:<br>–Acum voi găti cea mai delicioasă omletă pentru prima dată în viața mea!<br>–Mi-am dat seama că era prima dată. Data viitoare va găti ouăle fără coajă!`},
          {q:`O mamă îi spune fiicei sale:<br>–Hai să ne jucăm de-a v-ați ascunselea! Ascunde-te bine că, dacă te găsesc, o să te gâdil mult!<br>–Bine! Dacă nu mă găsești, te aștept lângă șifonier!`},
          {q:`O mamă își ceartă fiul obraznic:<br>–Cum ai reușit să faci atâtea răutăți într-o singură zi?<br>–M-am trezit devreme azi!`},
          {q:`Profesorul întreabă:<br>–Valentin, de ce ai întârziat la școală?<br>–Păi, doamnă, am căzut pe pernă și mi-am pierdut conștiința timp de o oră.`},
          {q:`Profesorul îl testează pe Pavel:<br>–Pavel, iar nu ai citit? O să îți pun nota 2!<br>–Doamnă, nu vreau să vă sperii, dar tati a spus că dacă vede un alt 2 în carnetul de note, cineva va fi certat!`},
          {q:`La grădina zoologică, o mamă își ceartă copilul:<br>–Matei, nu atinge tigrul! Poate avea purici!`},
          {q:`Profesorul întreabă:<br>–Ionuț, de ce nu ai caiet și creion?<br>–Doamnă, este 7:30 dimineața! Bucurați-vă că sunt aici!`},
          {q:`Tatăl către fiu:<br>–Fiule, eu plec în voiaj pentru câteva zile. Tu vei fi bărbatul casei.<br>–Bine, tată! Dar întoarce-te repede pentru că nu îmi place să spăl vase în fiecare zi.`},
          {q:`Navigație inventată pentru mamele distrase. Navigația arată cum se ajunge la adresă, dar le reamintește și de ce au mers acolo.`},
          {q:`Mama își căuta telefonul sub pat azi –în timp ce își lumina cu lanterna de la telefonul ei... Eu doar o priveam, ca sa nu îi distrag atenția.`},
          {q:`Doi tați care vorbesc între ei:<br>–Ce fiică studioasă și bună ai! Ce vârstă are?<br>–3 săptămâni fără telefon.`},
          {q:`Tata gătește linte și o întreabă pe mama:<br>–De unde știi că lintea nu va avea gust bun?<br>–Deja pui o a doua lingură de cacao!<br>–Ei bine, ce-o face maro!?`},
          {q:`Două mame vorbesc între ele:<br>–Ai auzit că, se vând borcane speciale pentru slăbit!<br>–Și cu ce sunt aceste borcane?<br>–Le deschizi și înăuntru –goale!`},
          {q:`Două adolescente la dietă se așază într-un magazin de bomboane. Vine chelnerița și una dintre fete o întreabă:<br>–Ce îmi recomandați, ceva fără zahăr și grăsimi.<br>–Șervețele!`},
          {q:`La școală s-a măsurat greutatea și înălțimea copiilor. Maria se întoarce acasă și o întreabă pe bunica:<br>–Bunico, cât cântăreşti?<br>–72 kg cu ochelarii, spune bunica.<br>–Și fără ochelari?<br>–Fără ei nu știu, că nu văd cântarul.`},
          {q:`Un profesor de educație fizică are o clasă cu elevi de clasa întâi.<br>–Faceți două ture! Pe locuri, înainte... marș! Stâng, stâng, stâng!<br>–Domnule antrenor, ce ar trebui să fac cu piciorul drept? întreabă Daniel.`},
          {q:`De ce se lasă să intre întâi doamnele? În trecut, când oamenii primitivi găseau noi peșteri în care să locuiască, le lăsau pe femei să intre mai întâi. Dacă nu le mânca nimeni, nu era niciun pericol, atunci restul intrau liniștiți.`},
          {q:`–Adelina, de ce ești absentă astăzi?<br>–Păi, pentru că există cataloage! Dacă nu ar fi existat cataloage, nu ați fi știut.`},
          {q:`Mama îl trezește pe elevul de clasa întâi:<br>–Cosmin, ridică-te! Îmbracă-te bine, azi plouă.<br>–O, dacă plouă, nu mă duc la școală!<br>–De ce?<br>–Când plouă, nu jucăm fotbal în curte, deci de ce să merg?`},
          {q:`Mama îl întreabă pe fiul ei:<br>–Sebastian, care este materia ta preferată la școală?<br>–Mingea, mamă!`},
          {q:`O bunică o întreabă pe mama nepotului ei (fiicei):<br>–De ce l-ai învățat pe copil atâtea luni să conducă și să vorbească, iar acum îi spui „Stop!”, „Taci puțin!”?`},
          {q:`–Bunico, câți ani ai?<br>–Mulți, bunico!<br>–Ei bine, dacă nu știi, uită-te la eticheta de pe bluză! A mea zice că am 7 ani –mărimea 122.`},
          {q:`Părinții pleacă după o plimbare în mall. Tata încearcă să plieze căruciorul bebelușului în timp ce mama aranjează gențile.<br>–Dragă, nu pot să pliez căruciorul, am încercat deja de două ori!<br>–Mai întâi, trebuie să scoți copilul și apoi să pliezi căruciorul!`},
          {q:`Copiii învață dansuri indiene. Profesorul predă instrucțiuni:<br>–Copii, imaginați-vă cum cu o mână înșurubați un bec, iar cu cealaltă scuturați firimituri de pe scaun. (Încercați și voi această mișcare!)`},
          {q:`–Tată, luminițele bradului de Crăciun ard!<br>–Fiule, se spune că strălucesc, nu că ard!<br>–Tati, tati, strălucește tot bradul de Crăciun, strălucește perdeaua, iar covorul și el strălucește...`},
          {q:`Doi adolescenți se plâng:<br>–Dimineața, când o aud pe maică-mea trezindu-mă, parcă aș fi lovit cu ciocanele.<br>–Ei bine, și sari imediat din pat?<br>–Nu, mă prefac de parcă aș fi fost bătut cu ciocanele și nu mă mișc.`},
          {q:`Copilul nu vrea să doarmă, iar mama îl întreabă pe tată:<br>–Să-i cânt ceva?<br>–Nu, dragă. Încearcă mai întâi cu binișorul! Nu îl supăra!`},
          {q:`Andrei o sună pe bunica lui:<br>–Bunico, vino să faci clătite pentru că fiica ta încă doarme!`},
          {q:`Un copil este întrebat:<br>–Pe cine iubești mai mult–pe mama sau pe tata?<br>–Pe bunicul!`},
          {q:`–Bunico, de ce ai urechile atât de mari?<br>–Să auzi când îți mârâie stomacul de foame, nepoate!`},
          {q:`–Gabriel, ce zile sunt cele mai grele pentru tine la școală?<br>–Primele 5 zile după duminică!`},
          {q:`Bunicul vine acasă. Apartamentul este într-un haos total: oale, jucării, haine, ghivece cu pământ împrăștiate pe jos...<br>Îngrozit, bunicul întreabă:<br>–Au intrat hoții? Ne-au jefuit?<br>–Nu, nepoții au fost în vizită la noi.`},
          {q:`–Maria, ce vei fi când te vei face mare?<br>–Cântăreață, pentru că ieri vecinul mi-a dat 100 de lei să tac. Mi-am dat seama că îmi pot câștiga existența cântând!`},
          {q:`Un elev de clasa a doua a fost întrebat ce este creierul.<br>–Creierul este folosit pentru durerile de cap. Când o persoană are un nas care curge, creierul se scurge prin nas. Creierul este foarte sensibil și de aceea este bine să-l protejezi și să te gândești mai puțin!`},
          {q:`–Mamă, când vine Moș Crăciun?<br>–De ce, Laura?<br>–Ei bine, m-am săturat să fiu bună și să servesc... e cam plictisitor! Cât a mai rămas?`},
          {q:`Părinții vorbesc între ei:<br>–Am pus copilul să mănânce 8 chiftele și 2 felii de pâine, să nu ia medicamentul pe stomacul gol. – spune tatăl în cauză.<br>–Pe el îl doare urechea, îl tratez cu picături pentru urechi! –spune mama.`},
          {q:`Un copil care vorbește îngrijorat cu mama lui:<br>–Mamă, eu mănânc, tu gătești. Eu mă murdăresc, tu mă cureți. Încurc ceva, tu faci ordine. Bine că m-ai născut, ce făceai dacă nu eram?`},
          {q:`Într-un magazin de jucării, un copil vrea să-și cumpere a 15-a mașină cu telecomandă. Mama refuză să-i cumpere și acesta începe să urle tare. Ei intră în magazin și nu încetează să țipe. La un moment dat copilul se oprește.<br>–Îți mulțumesc că nu mai plângi, într-adevăr mașina asta este un gunoi mare. Și ai multe acasă! –îl încurajează cu mândrie mama.<br>–Sunt foarte obosit, mă odihnesc! După un timp, încep din nou să urlu, dar mai tare!`},
          {q:`Anul acesta, mama a decis să-i scrie o scrisoare lui Moș Crăciun.<br>„Dragă Moș Crăciun, am fost foarte bună anul acesta și voi cere doar două lucruri! Vreau să slăbesc și vreau mai mulți bani!”<br>Moș Crăciun a răspuns și el cu o scrisoare:<br>„Nu mai hrăniți copiii și nu le mai cumpărați atâtea jucării!”`},
          {q:`Mama în fața șifonierului:<br>–O rochiță neagră, o rochie roșie, o rochiță galbenă de vară... cea cu buline și e prea mică pentru mine...`},
          {q:`E seară și o mamă îl întreabă pe copilul care stă întins în camera lui:<br>–Ce faci, mami?<br>–Mă odihnesc trist, că mâine sunt la școală... Și cât aș vrea să mă odihnesc fericit!`},
          {q:`Alex merge să-l viziteze pe Victor. Deschide frigiderul și vede sticle goale de băuturi răcoritoare.<br>–Victor, de ce ai sticle goale în frigider?<br>–Pentru a atrage musafiri care nu vor nimic de băut.`},
          {q:`La sfârșitul vacanței de vară, o mamă a unui viitor elev de clasa a treia își întreabă neliniștită fiul:<br>–Vacanța s-a terminat, ce îi vei spune doamnei? Ce ai citit?<br>–Mamă, relaxează-te, citesc în fiecare zi! În fiecare zi când sunt în magazin –citesc etichetele. Știți câte etichete sunt în magazin?`},
          {q:`Mama se enervează pe copil:<br>–De ce ai băut toată sticla de Coca-Cola? Știi că nu-ți permit!<br>–Mamă, am pierdut capacul și mi-a fost teamă să nu se verse.`},
          {q:`După ora de matematică, profesorul întreabă:<br>–Ioan, ce ai înțeles?<br>–Să țin minte unu, doamnă!`},
          {q:`Un tată își ceartă fiul:<br>–Fiule, nu e nimic în capul tău! Ascultă, sună a gol! –și bate cu degetele în masă pentru ca fiul său să audă...<br>–Tată, cineva bate la uşă!<br>-Stai aici, fiule, voi deschide! –îndreptându-se către ușă.`},
          {q:`Un nepot îl întreabă îngrijorat pe bunicul său:<br>–Bunicule, pentru cine mănânci?<br>–Cum pentru cine? Pentru mine.<br>–Bunica a spus că mănânci pentru patru.`},
          {q:`Lucian îi cere mamei lui să-i cumpere o jucărie de la magazin. Mama refuză, iar Lucian o asigură cu încredere:<br>–Mamă, nu-ți face griji, o să-ți dau banii când ajungem acasă! Apoi voi face alți bani.<br>–Și de unde o să îi iei?<br>–Mă duc la bunica și ea singură îmi dă - 10 lei, 20 lei... Așa faci bani, mamă!`},
          {q:`Mama intră în camera copiilor:<br>–Copii, în camera voastră parcă dulapul cu jucării a strănutat și dulapul a vomitat pe podea...`},
          {q:`La ora de educație fizică, antrenorul îi spune unui copil:<br>–Radu, fă un pod!<br>–Dar... eu nu sunt Anghel Saligny!`},
          {q:`Mama îl întreabă pe copil:<br>–Alex, ai mâncat fasole la prânz astăzi la școală?<br>-Da! –a răspuns Alex și a confirmat cele spuse foarte zgomotos și mirositor.`},
          {q:`Bunicul în vizită la nepot. Acesta îl întreabă:<br>–Câți bani ai strâns cu sorcova?<br>–Mult! – răspunde nepotul.<br>–Trebuie să cumperi ceva, pentru că inflația îți va mânca banii! – îl sfătuiește bunicul.<br>–E în regulă, nu o cunosc și nici ea nu știe unde locuiesc! – răspunde fără grijă nepotul.`},
          {q:`Un copil se plânge bunicii sale:<br>–O, bunico, acești mici au fost stricați. Mă simt rău!<br>–Cât ai mâncat, Tony?<br>–12, bunico... și trei felii de pâine.`},
          {q:`Bunica la nepotul ei:<br>–Cătălin, mâine trebuie să returnăm ceasurile.<br>–Bunico, nu se poate. Îmi place al meu și nu-mi amintesc de unde mi l-a cumpărat tata!`},
          {q:`Un copil sună la poliție:<br>–Bună, mă țin aici cu forța!<br>–Unde ești?<br>–La școală.`},
          {q:`Este dimineață. Un dentist vine la serviciu și își întâlnește asistenta în afara cabinetului:<br>–Bună dimineața, sunt pacienți?<br>–Da, primul este un băiat de 12 ani, îi vom extrage molarul.<br>–Bine, hai să mergem în cabinet. – spune doctorul.<br>–Nu putem, s-a încuiat pe interior!`},
          {q:`Este seară și un copil își întreabă mama:<br>–Mamă, pot să iau o bucată de ciocolată?<br>–Nu! – spuse mama.<br>–Oh, te iubesc atât de mult! Și nu am vrut doar una, îmi dai toată ciocolata sau jumătate?`},
          {q:`Doi frați de 9 și 12 ani își vizitează bunica. Unul aleargă spre ea și strigă:<br>–Bunica, fratele meu m-a lovit cu scaunul!<br>Bunica a strigat:<br>–Pavel, de ce l-ai lovit pe fratele tău cu scaunul?<br>–Pentru că masa era foarte grea și nu am putut s-o ridic!`},
          {q:`Mama și fiica se pregătesc să iasă:<br>–Mamă, unde mergem?<br>–Astăzi deschid o expoziție în centru. Ne ducem la expoziție.<br>–Și crezi că va dori cineva să se uite la noi?`},
          {q:`Un bunic își învață nepotul:<br>–Trebuie să mănânci mai mult! În fiecare zi cel puțin de cinci ori.<br>–De ce, bunicule?<br>–Să crești mare!<br>–Da, și tu de ce mănânci atunci? Ești mare acum!`},
          {q:`Mama se întoarce acasă de la coafor. Se simte foarte frumoasă cu noua ei coafură scurtă. Este întâmpinată de fiica ei:<br>–Oh, mamă, nu-ți face griji! În curând, părul tău va crește din nou și vei fi din nou frumoasă!`},
          {q:`Un elev de clasa a II-a o întreabă pe bunica lui:<br>–Bunico, cât e ceasul?<br>–10 minus 6.<br>–E ora 4 bunico, e timpul să ieșim în parc!`},
          {q:`Mama se enervează pe copii:<br>–Copii, m-am săturat de acest Lego, care este peste tot pe podea!<br>–Mamă, pune-ți papucii! Nu putem să le adunăm în fiecare zi!`},
          {q:`O bunica îl întreabă pe nepotul ei:<br>–Care este cel mai dificil lucru la școală?<br>–Să mă trezesc dimineața, bunico.`},
          {q:`O mamă rezolvă probleme cu băiatul ei de clasa а II-a:<br>–Andrei, ai 20 de bomboane. Câte îți vor rămâne dacă îi dai 7 surorii tale?<br>–19, mamă.<br>–Ei bine, cum ai socotit?<br>–Ei bine, dacă nu sunt nebun să-i dau 7, îi dau 1 și voi rămâne cu 19 bomboane.`},
          {q:`La cină, copilul îl întreabă pe tatăl său:<br>–Tată, de ce nu ne putem uita la televizor în timp ce luăm cina?<br>–Pentru că televizorului nu-i place să se uite cum măncăm, băiatul meu.`},
          {q:`O mamă își întâmpină fiul după școală:<br>–Sunt foarte supărată! Astăzi am primit o notificare în aplicația carnetul de note, ai din nou un 3!<br>-Mamă, dacă acest carnet de note electronic te enervează atât de mult, șterge-l de pe telefon! Eu șterg aplicațiile care nu-mi plac.`},
          {q:`Profesoara îl întreabă pe Tudor:<br>–Tudor, spune-mi cine ți-a rezolvat exercițiile?<br>–Nu știu, doamnă, am uitat caietul la bunica și acolo locuiesc cinci oameni, știu eu cine a fost?...`},
          {q:`În timpul orelor de matematică, profesorul îi remarcă lui Florin:<br>–Florin, nu te juca în timp ce rezolvi exercițiile!<br>–Nu rezolv exerciții, doamnă, doar mă joc.`},
          {q:`O mamă îl întreabă pe fiul ei:<br>–De ce citești manualul de istorie pe dos?<br>–Ce contează, mamă, nu este totul în trecut?...`},
          {q:`Tata pescuiește cu copiii.<br>–Tati, prinde-mi viermele!<br>–Tati, mi-am udat pantoful!<br>–Tati, unde este apa?<br>–Tati, mai este ceva de mâncare?<br>–Tati, tată, azi te descurci foarte bine!<br>–Tati, de ce ești așa de bun pescar?<br>–Pentru că peștii sunt curioși cine este acesta, „Tati, tati, tati, tatiii...”, și se apucă de cârlig să îl vadă.`},
          {q:`Un elev de clasa întâi se întoarce din prima zi de școală și mama lui îl întreabă:<br>–Cum a fost ziua ta, Martin?<br>–Grozav, dar cred că n-o să mă duc mâine.<br>–De ce?<br>–Pentru că știu deja tot ce trebuie învățat!`},
          {q:`Un băiat îi spune tatălui său:<br>–Tată, când voi fi mare, vreau să devin om de știință.<br>–Grozav, fiule! Și în ce sferă?<br>–În domeniul sărbătorilor!`},
          {q:`O mamă își întreabă copilul:<br>–Cum a fost ziua ta la școală?<br>Copilul răspunde:<br>–Grozav, mamă! Am câștigat un premiu pentru cea mai liniștită și lentă lectură!`},
          {q:`La școală, profesorul întreabă:<br>–Cine poate să-mi spună care este cel mai mic număr?<br>Micul Alex răspunde:<br>–Nota mea la matematică, doamnă!`},
          {q:`Profesorul de muzică îi întreabă pe copii:<br>–Ce este o orchestră?<br>Micul Pavel răspunde:<br>–Este un grup de oameni care cântă la instrumente împreună –iar dirijorul flutură bagheta ca să nu adoarmă!`},
          {q:`Un profesor îl întreabă pe Ianis:<br>–Ianis, dacă ai 10 mere și îți mai dau 5, câte vei avea?<br>–Zece, doamnă, pentru că îmi plac doar bananele!`},
          {q:`Copilul îl întreabă pe tatăl său:<br>–Tată, de ce spui mereu că sunt micuța ta stea?<br>Tatăl răspunde:<br>–Pentru că te luminezi în fiecare seară când îți cer să te culci, iar dimineața te stingi când trebuie să te trezești!`},
          {q:`Bulă îl întreabă pe profesorul de matematică:<br>–Doamnă, dacă am 5 mere într-o mână și 6 în cealaltă, ce am?<br>–Mâini mari, Bulă!`},
          {q:`Darina, în vârstă de 10 ani, o întreabă pe mama ei:<br>–Mamă, pot să o invit pe Emma să doarmă în noaptea asta și să fac o petrecere în pijamale?<br>–Desigur, dragă, mă voi bucura să te văd distrându-te. Îți cer doar înainte de asta să arunci rufele la coș, să-ți cureți camera și să schimbi cearșafurile de pe pat.<br>Darina se grăbește să o sune pe Emma.<br>–Emma, îmi pare rău, dar nu poți veni în seara aceasta. Mama nu-mi permite.`},

          {q:`Un copil se întoarce de la școală și îi spune mamei sale:<br>–Mamă, astăzi am aflat că Pământul se învârte în jurul Soarelui.<br>–Și ce părere ai despre această informație?<br>–Puțin amețit, mamă!`},

          {q:`Bunicul îi spune nepotului său:<br>–Când eram mic, mergeam 5 kilometri până la școală.<br>Nepotul răspunde:<br>–Păi, bunicule, acum doi ani am avut 5 clickuri până la școala online!`},

          {q:`O mamă îl întreabă pe fiul ei:<br>–Rareș, știi de ce broccoli este bun pentru creier?<br>–Pentru că face creierul să se gândească foarte mult până când își dă seama să nu le mai mănânce.`},

          {q:`Tata se uită la un album de fotografii de familie cu copiii săi:<br>–Tată, cine este bărbatul ăla din poză cu barbă mare?<br>–Sunt eu înainte să vă cunosc.<br>–Și ce s-a întâmplat?<br>–V-am înțepat când v-am îmbrățișat...`},
          {q:`Un copil îl întreabă pe bunicul său:<br>–Bunicule, de ce porți ochelari?<br>–Pentru a vedea mai bine, Marius.<br>–Și de ce nu poți vedea unde este telecomanda?`},
          {q:`O mamă îl întreabă pe fiul ei:<br>–De ce ai scris în temă că vaca este cel mai important animal?<br>–Pentru că de la ea vin ciocolata cu lapte și înghețata, mamă!`},
          {q:`O mamă îi explică fiicei sale de ce ar trebui să se spele pe dinți:<br>–Dacă nu te speli pe dinți, aceștia se vor îngălbeni cu pete maronii.<br>–Ooh, asta s-a întâmplat și cu bananele!`},
          {q:`O bunică îi spune nepotului ei:<br>–Nicola, dacă mănânci toate legumele, vei avea multă energie și vei fi sănătos!<br>–Bunico, ți le las ție. Tu ai nevoie de ele. N-ai spus că ești obosită?!`},

          {q:`Un adolescent vine acasă și întreabă:<br>–Mamă, ce ai gătit azi?<br>–Nimic, dragă!<br>–Ei bine, ieri a fost din nou „nimic”!<br>–Ei bine, am gătit două zile!`},
          {q:`Doi frați vorbesc între ei:<br>–Frate, am o superputere!<br>–Și care este ea?<br>–Pot să fac frigiderul să se aprindă doar cu o privire!<br>–Acela este senzorul automat, frate...`},

          {q:`Pe plajă, copiii se joacă în jurul prosoapelor a două doamne foarte machiate, care se bucură de o vacanță cu cocktailuri mari și fără copii. Revoltată, una le-a spus părinților din apropiere:<br>–Vă rog să vă luați copilul cu voi, este foarte zgomotos!<br>–Doamnă, acesta nu este copilul meu –spune tatăl –al meu este cel care tocmai varsă pe nisip cocktailul dvs.`},
          {q:`O mamă decide să verifice dacă băiatul ei studiază istoria. Intră în cameră și se înfurie:<br>–De ce mă înfurii? În loc să fii cu manualul în mână, te joci la computer!<br>–Mamă, ca să nu te enervezi, bați mai întâi la uşă, numără până la cinci şi apoi intră. Așa voi avea timp să opresc jocul și să iau manualul în mână.`},

          {q:`Când avea 5 ani îi plăcea o motocicletă (nu că nu avea acasă altele) în magazinul de lângă bloc. Am refuzat să i-o cumpăr, la urma urmei, intrasem după pâine. După doar două ore, a venit cu această motocicletă acasă. L-a întâlnit pe bunicul său și l-a rugat să se ducă la magazin împreună.`},

          {q:`Cum trebuie să te comporți în locuri publice?`,opt1:`Să fiu calm și să nu fac zgomot.`,opt2:`Să caut un agent secret sub acoperire. Cine știe, s-ar putea să fie pe undeva!`},
          {q:`Ce faci dacă vezi un copil necunoscut care vrea să intre în joc?`,opt1:`Întreb prietenii, iar dacă toată lumea este de acord, îl primim.`,opt2:`Vreau să știu dacă nu este cumva un spion al extratereștrilor și îi verific urechile.`},
          {q:`Ce faci dacă ești la o petrecere în familie într-un restaurant?`,opt1:`Mă comport politicos și ajut, dacă este necesar.`,opt2:`Testez toate scaunele disponibile.`},

          {q:`Ce faci când aștepți autobuzul cu părinții tăi?`,opt1:`Aștept cu răbdare și stau aproape de ei.`,opt2:`Dansez un dans indian, să vină mai repede.`},
          {q:`Cum trebuie să reacționezi dacă un prieten și-a zgâriat genunchiul în timp ce alerga?`,opt1:`Îl ajut, iar dacă este nevoie, sun un adult.`,opt2:`Îi dau un plasture de supererou și îi spun că este timpul să îl salvez.`},
          {q:`Cum trebuie să te comporți în avion în timpul zborului?`,opt1:`Stau liniștit pe scaunul meu și ascult însoțitorii de bord.`,opt2:`Bat la geam să sperii norii.`},
          {q:`Cum reacționezi dacă unul dintre prietenii tăi aruncă mingea în afara locului de joacă?`,opt1:`Îl ajut să o găsim împreună.`,opt2:`Mă prefac că sunt o minge magică și plecăm în aventură.`},
          {q:`Ce spui când este timpul să pleci de la o petrecere?`,opt1:`Mulțumesc pentru petrecerea frumoasă și spun „la revedere” tuturor.`,opt2:`Le spun părinților mei de față cu gazdele că „a fost o petrecere oribilă, hai, că mi-e foame!”.`},
          {q:`Ce faci dacă vrei să te joci cu jucăria familiei pe care o vizitezi?`,opt1:`Cer permisiune înainte de a lua jucăria.`,opt2:`Ofer la schimb jucăria mea secretă invizibilă.`},
          {q:`Ce faci dacă în tabără există activități care nu îți plac?`,opt1:`Le încerc, poate s-ar putea să-mi placă.`,opt2:`Mă prefac că palmele mele sunt lipite cu marmelada de la micul-dejun.`},
          {q:`Ce faci când e timpul să te duci acasă?`,opt1:`Respect ora stabilită cu părinții și plec la timp.`,opt2:`Dau semnal unei mașini de poliție și fug.`},
          {q:`De ce ar trebui să ne spălăm pe mâini înainte de a mânca?`,opt1:`Pentru а nu introduce germeni și bacterii în gură.`,opt2:`Pentru a nu deveni supereroi cu forțe microbiene.`},
          {q:`Ce faci dacă se rănește cineva în timp ce se joacă?`,opt1:`Oprim jocul și căutăm ajutor de la un adult.`,opt2:`Dispar ca să nu se creadă că eu sunt vinovat.`},
          {q:`Ce faci când joci fotbal și a intrat mingea pe terenul altcuiva?`,opt1:`Cer proprietarului permisiunea de a lua mingea.`,opt2:`Îmi fac un plan pentru misiunea „Săritul gardului".`},
          {q:`Ce faci când te joci ceva și începeți să vă certați cu privire la reguli?`,opt1:`Încercăm să ne înțelegem și să ne jucăm frumos.`,opt2:`Fac precum o mașină de pompieri în timp ce îi conving să fie de acord cu regulile mele.`},
          {q:`Cum reacționezi dacă de ziua ta ți se oferă mâncare care nu îți place?`,opt1:`Refuz politicos.`,opt2:`Mă prefac că sunt extraterestru, care nu mănâncă mâncare pământeană.`}

      {
        id: `povestile_maniera`,
        title: `Poveștile elfei Maniera`,
        icon: `🧚`,
        type: `story`,
        items: [
          {title:`Maniera și Nepoliticosul`,
           body:`Era odată ca niciodată un regat magic, unde fiecare răsărit era un nou început, iar în acest regat trăia o mică elfă care avea grijă de fericirea copiilor. În regatul ei plin de culoare, Maniera se gândea mereu la copiii Pământului care uită cât de importante sunt cuvintele și faptele bune.

Într-o zi, Maniera a simțit că trebuie să ajute un băiat cunoscut printre colegii săi ca Nepoliticosul. Se știa că se comporta urât cu copiii. Își bătea joc de alții pentru că așa credea el că pare mai puternic decât ceilalți.

Maniera a coborât pe Pământ și l-a găsit pe Nepoliticos în curtea școlii, chiar înainte să-i spună cuvinte grosolane unuia dintre copii. Mica elfă Maniera a aterizat pe umărul lui și i-a șoptit: –Bună, Nepoliticosule! Știi că fiecare cuvânt pe care îl spui are putere? Această putere poate fi folosită pentru a face bine sau pentru a face rău. Cuvintele tale pot fi ca razele de soare care încălzesc inimile oamenilor sau ca un vânt rece care îi face să se simtă rău și să fugă de tine.

Nepoliticosul se uită la Maniera cu uimire. Nu se gândise niciodată la cuvintele lui în acest fel. –Cum te-ai simți dacă te-ar jigni cineva? Probabil că nu te-ai simți bine. Ceilalți simt la fel când îi jignești – a continuat Maniera. –Dacă începi să-ți folosești cuvintele pentru a da stare de bine, vei vedea ce miracol se va întâmpla.

A doua zi, Nepoliticosul a decis să-și schimbe atitudinea. A început să spună lucruri frumoase colegilor săi. În loc să critice ca de obicei, a lăudat desenul colegului său de clasă: –Te-ai descurcat bine, Teodor! Curând, Nepoliticosul a devenit favoritul școlii. Copiii au început să râdă CU el, nu de el.

Într-un moment amuzant, în timp ce toată lumea se juca în curte, Nepoliticosul s-a împiedicat accidental de un băț și s-a rostogolit înainte ca un acrobat. Toată lumea a izbucnit în râs, iar Nepoliticosul a început și el să râdă, în loc să se înfurie și să jignească, realizând că era mult mai frumos... să fie un subiect de veselie decât de frică.

Din acel moment, Nepoliticosul a devenit cunoscut drept Politicosul. El a înțeles puterea cuvintelor amabile și că ele pot schimba lumea. Datorită Manierei, a învățat că adevărata putere vine din bunătate și politețe, nu din nepolitețe și agresivitate.`,
           questions:[`Voi cunoașteți vreun Nepoliticos?`,`Ce îl puteți sfătui?`]},
          {title:`Maniera și Teribilistul`,
           body:`Într-un regat magic îndepărtat, printre nori, mica elfă Maniera își revizuia angajamentele din agendă. Maniera iubea să ajute copiii să fie mai buni și fericiți. Erau mii de sarcini... mii de copii care aveau nevoie de atenția ei. În lista ei a venit rândul lui Teribil, „cel mai groaznic copil”, așa cum îl caracterizau copiii din clasa lui.

Maniera a zburat pe Pământ pentru a-l căuta pe Teribilistul, băiatul care era cunoscut pentru comportamentul său urât. Lovea cu piciorul colegii de clasă, le arunca ghiozdanele și își bătea mereu joc de ei. În fiecare zi, copiii se plângeau la învățătoare și la părinți de Teribilist.

Maniera a coborât din nori și a apărut în curtea școlii. L-a văzut pe Teribilist trăgând de limba unui copil și a decis că este timpul să-l ajute să se schimbe. Maniera s-a apropiat de Teribilist și i-a spus: –Îngrozitor, știi că fiecare copil este special și poate aduce fericire altora? Ai și tu această abilitate! Poți fi un bun prieten! Îi poți ajuta pe alții și îi poți face să zâmbească.

Teribilistul a fost inițial surprins de cuvintele Manierei, dar a început să se gândească la ele. Zilele au trecut la școală, iar Teribilistul a început să facă gesturi pe care nu le mai făcuse niciodată până atunci. A ajutat o fetiță să-și ridice geanta, apoi i-a dat mingea unui băiat mai mic, căruia îi era teamă să o ceară, a jucat fotbal cu băieții o pauză întreagă fără să îi lovească cu piciorul sau să îi scuipe.

Curând, toată lumea a observat schimbarea Teribilistului. A început să-și ajute colegii de clasă și să fie drăguț cu ei. Copiii au început să-l placă și să se bucure de compania lui. L-au inclus în jocurile din curtea școlii și voiau să joace mereu fotbal cu el.

Într-o zi, Teribilistul a încercat să o imite pe Maniera, ridicând mâinile și spunând: –Voi face ca toată lumea să râdă în mod magic! A început imediat să facă mișcări amuzante și haioase, în timp ce mergea ca un clovn. Toți copiii au râs în hohote, iar Teribilistul și-a dat seama că a face oamenii fericiți este mult mai bine decât să îi jignești.

Datorită Manierei, Teribilistul a învățat valoarea bunătății și s-a împrietenit cu toți colegii săi. Și-a dat seama că fiecare copil are bunătate în el. Faptele bune făcute de el au adus fericire nu numai celorlalți, ci și lui însuși. Teribilistul a devenit fericit...`,
           questions:[`Tu ai în clasă copii ca Teribilistul?`,`Tu ești considerat Teribilist?`,`Cum poți ajuta un asemenea copil pentru a deveni mai bun?`]},
          {title:`Maniera și Supărăciosul`,
           body:`În regatul îndepărtat al elfei Maniera, ziua era minunată. Maniera era atât de mică, precum o frunză de trifoi, dar inima îi era atât de mare, precum cerul. În fiecare dimineață, Maniera strângea roua dimineții de pe flori pentru a-și pregăti elixirul magic pentru bucurie.

Departe de regatul Manierei, într-o școală pe Pământ, era un băiat pe nume Supărăciosul. Era cunoscut la școală drept morocănosul etern. Supărăcios nu saluta niciodată, nu spunea niciodată „Bună dimineața!” și arăta mereu posomorât.

Într-o dimineață, când Supărăciosul a intrat în clasă, din nou fără să-i salute, Maniera a apărut brusc și a aterizat pe umărul lui. –Bună, Supărăciosule! i-a șoptit ea. Știi că fiecare cuvânt al tău poate fi ca o rază de soare pentru cineva? Când spui „Bună dimineața!”, răspândești lumină și căldură.

Supărăciosul a privit-o neîncrezător, dar în ochii lui Maniera era ceva magic, care l-a făcut să aibă încredere în ea. Și a crezut-o! A doua zi dimineața, băiatul și-a adunat curajul și și-a salutat părinții cu „bună dimineața!”. Au zâmbit larg și i-au întors salutul. La școală, Supărăcios i-a salutat pe oamenii de la pază, pe profesorii de pe coridor și chiar pe colegii săi. Spre surprinderea lui, toată lumea i-a zâmbit înapoi.

Cu fiecare zi care trecea, Supărăciosul a început să se schimbe. El a înțeles cum cuvintele au putere să schimbe nu numai ziua altora, ci și pe a lui. Maniera îl privea de departe, zâmbind la fiecare mică schimbare în el.

Așa că, într-o dimineață, Supărăciosul a decis să fie și mai îndrăzneț. S-a ridicat în fața tablei și a strigat: –Bună dimineața tuturor! Toată lumea a râs, pentru că Supărăciosul imita vocea învățătoarei. A devenit eroul amuzant al clasei, cel care zâmbește adesea.

De atunci, Supărăciosul nu a mai fost eternul posomorât, ci băiatul care salută zâmbind și primește zâmbete.`,
           questions:[`Voi ați salutat în această dimineață?`,`Vă salutați învățătoarele și colegii?`,`Vă salutați vecinii? Salutați vânzătoarele când intrați în magazine?`,`Voi v-ați comportat vreodată ca Supărăciosul?`]},
          {title:`Maniera și Bătăușul`,
           body:`În a patra zi de aventură pe Pământ, mica elfă Maniera s-a hotărât să viziteze o nouă locație. De data aceasta, misiunea ei a fost să ajute un băiat pe nume Bătăuș. În acea zi, Maniera a decis să-i observe îndeaproape pe copiii din curtea școlii, ascunși printre ramurile unui copac mare de salcie.

Bătăușul era cunoscut în școală și în cartier pentru că se bătea adesea cu alți copii. El credea că acesta este modul de a-și arăta puterea. Într-o zi, când bătăuș era pe cale să se bată din nou, elfa Maniera a apărut lângă el. –Bătăușul - începu Maniera cu o voce calmă -, adevărata putere nu este în a fi nepoliticos, ci în a fi bun și curajos. Nu trebuie să lupți pentru a fi respectat și iubit.

Bătăușul o privi surprins. Cuvintele ei l-au pus pe gânduri. –Uite - a continuat Maniera -, adevărații eroi sunt cei care își folosesc puterea pentru a proteja și ajuta. Curajul de a fi bun este cea mai mare putere.

De atunci, Bătăușul a început să vadă lumea într-un nou mod. A încetat să se mai bată și a început să-și ajute colegii de clasă. Când cineva avea nevoie de ajutor, Bătăușul era mereu acolo pentru a-l proteja și sprijini.

Bătăușul a continuat să-și arate partea bună, ajutându-și și protejându-și colegii de clasă. Într-o zi, când toată lumea era în curtea școlii pentru recreere, a decis să se comporte distractiv, pentru a-i înveseli pe toți. Bătăușul a găsit un costum de clovn vechi, abandonat, în depozitul de echipamente sportive. S-a îmbrăcat repede și a ieșit în fața prietenilor săi, făcând trucuri amuzante și diverse farse. A făcut expresii amuzante și chiar a interpretat un dans al pinguinilor neașteptat de amuzant, alunecând și căzând într-un mod comic.

Toți copiii au râs cu poftă și au aplaudat noul lor prieten. Bătăușul a zâmbit larg, realizând că râsul și bunătatea sunt mult mai puternice decât agresivitatea. Din acel moment, Bătăușul a fost cunoscut în școală nu doar ca un bun elev, ci și ca unul amuzant. Datorită Manierei, a învățat că adevărata putere se află în inimă și în capacitatea de a-i înveseli pe ceilalți.

Și astfel, cu ajutorul micii elfe, Bătăușul a devenit un adevărat erou în ochii tuturor - un erou care știe să-și facă prietenii să râdă și să-i protejeze.`,
           questions:[`Cunoașteți pe cineva care seamănă cu Bătăușul?`]},
          {title:`Maniera și Gelozica`,
           body:`Într-o școală, unde în fiecare zi se întâmplau diferite aventuri, era o elevă pe nume Gelozica. Era mereu geloasă pe jucăriile, hainele și pantofii altor copii. Fiecare lucru nou pe care îl vedea o făcea să-și dorească să dețină același lucru.

Într-o zi, în timp ce Gelozica visa din nou la jucăriile altora, mica elfă a zburat către ea... Maniera a aterizat lângă Gelozica și i-a șoptit: - Gelozica, adevărata valoare nu este ascunsă în lucrurile pe care le deții. Unicitatea și inima ta sunt cele mai mari comori ale tale. Iubește ceea ce ai și vei vedea cât de specială ești.

Gelozica s-a gândit la cuvintele Manierei și apoi și-a dat seama că elfa avea dreptate. Ea a început să-și aprecieze propriile bunuri, văzându-le într-o lumină nouă. Pantofii i se păreau deja niște comori minunate, pline de aventuri și amintiri.

A doua zi, în timp ce toți copiii se jucau în curte, Gelozica a decis să le povestească prietenilor despre întâlnirea ei cu Maniera. A început să se învârtă și să danseze în „pantofii ei minunați”. În acel moment, o pisicuță curioasă care venise la școală a sărit în sus și a început să se joace cu șireturile ei. Gelozica a încercat să danseze împreună cu pisica, dar s-a împiedicat și a căzut pe iarbă, râzând cu poftă cu restul copiilor.

Toată lumea a râs de scena amuzantă, iar Gelozica și-a dat seama că adevărata bucurie vine din împărtășirea momentelor de fericire și râs. Ea a învățat că fericirea nu stă în posesia lucrurilor, ci în capacitatea de a te bucura de momente și de a aprecia ceea ce ai.

De atunci, Gelozica a devenit cunoscută la școală pentru dispoziția ei veselă și capacitatea de a găsi fericirea în lucrurile mărunte. Datorită Manierei, ea a învățat că fiecare copil este unic și special în felul său.`,
           questions:[]},
          {title:`Maniera și Nerespectuosul`,
           body:`În regatul îndepărtat, în ceruri, unde elfii dansează printre stele, trăia o mică elfă pe nume Maniera. Ea se îngrijora mereu pentru copiii de pe Pământ care uitau ce este respectul și disciplina. Maniera știa că respectul pentru profesori este cheia succesului și a dezvoltării fiecărui elev. Printre acești copii se număra și băiatul Nerespectuos.

La școală, Nerespectuosul neglija adesea lecțiile de matematică. Nu numai că nu-l asculta pe profesorul său, dar nici nu îl respecta. Băiatul vorbea cu colegii săi în timpul orei, se juca la telefon și răspundea des cu aroganţă profesorului.

Într-o zi, în timpul orelor de matematică, atunci când Nerespectuosul își ridicase picioarele pe bancă, elfa Maniera apăru lângă el. Strălucind ca o stea de dimineață, ea s-a așezat pe umărul lui și i-a șoptit: –Nerespectuosule, știai că respectul și considerația pot descuia ușile cunoașterii și succesului? Când îți respecți profesorul, îți respecți viitorul. Fiecare lecție este o oportunitate de a învăța ceva nou. În plus, studiul este ca gimnastica pentru creier - cu cât înveți mai mult, cu cât exersezi mai mult, cu atât mintea ta va fi mai rapidă și mai puternică!

Aceste cuvinte au lăsat o impresie profundă în inima Nerespectuosului. Și-a dat seama că felul lui de a se comporta nu numai că l-a împiedicat să învețe, dar și complica munca profesorului și a altor elevi.

A doua zi, Nerespectuosul a început să se schimbe și să-și antreneze creierul. Asculta cu atenție în timpul lecțiilor, punea întrebări și participa activ la discuții. Curând, și-a îmbunătățit notele și a început să se bucure de învățare. Părinții și profesorul lui au observat schimbarea și l-au lăudat. Profesorul i-a acordat chiar și un premiu special pentru cel mai de succes elev al lunii.

Într-o zi, profesorul l-a scos pe Nerespectuos la tablă pentru a rezolva o problemă: 5+5 = ? Nerespectuosul s-a distrat și a scris accidental 10 cu un alt zero - 5+5=100. Toți cei din clasă au izbucnit în râs. Nerespectuosul a „introdus” repede doi ochi și un zâmbet în zero, iar zeroul s-a transformat într-un om zâmbitor. Așa că băiatul și-a făcut și profesorul să râdă. Nerespectuosul a înțeles că învățatul poate fi și distractiv.

De atunci, Nerespectuosul a devenit un exemplu pentru alți elevi. El a învățat că respectul pentru profesori și învățatul sunt pași importanți către succes. Mulțumită Manierei, Nerespectuosul a descoperit bucuria de a învăța și importanța respectului.`,
           questions:[]},
          {title:`Maniera și Timida`,
           body:`În regatul fermecat, unde elfii împletesc vise și fac minunății, elfa Maniera își petrecea timpul fiind atentă la bunătatea și manierele copiilor. Maniera adesea se îngrijora pentru copiii Pământului, în special de cei care nu cunoșteau semnificația prieteniei și a bunătății.

Într-o școală de pe Pământ, în clasa a doua, era o fetiță pe nume Timida. Era chiar un copil foarte amabil și tăcut, mereu gata să ajute și să ia parte la lecții. Totuși, celelalte fete din clasă au decis să o izoleze. Nu o invitau la jocurile lor și o evitau în timpul pauzei. Se simțea foarte singură. A început chiar să joace fotbal cu băieții, pentru a se distra.

Într-o zi când fetele au exclus-o din nou din jocurile lor, lângă ele a aterizat Maniera. Ea s-a așezat pe unul dintre copacii din curtea școlii și le-a spus fetelor: –Bună, dragile mele! Știați că fiecare copil este unic și interesant? Când excluzi pe cineva din jocurile tale, pierzi ocazia de a învăța ceva nou și interesant despre acea persoană.

Fetele au ascultat cu atenție, iar Timida stătea deoparte, surprinsă de apariția acestei mici elfe. Maniera a continuat: –Fiecare dintre voi este special și fiecare merită să facă parte din grup. Gândiți-vă cât de multe jocuri și aventuri distractive puteți avea împreună! După cuvintele Manierei, fetele și-au dat seama de greșeala lor. Au invitat-o pe Timida să li se alăture. Ea a acceptat, chiar cu bucurie.

În timp ce se zbenguiau, un lucru mic, roșu aprins, a aterizat pe nasul Dorei. Toată lumea s-a oprit și s-a uitat - era o gărgăriță mică. Părea că dansează pe nasul ei. Timida și-a încrucișat ochii, încercând să vadă gărgărița, și a început să se plimbe ca un magician care încearcă să țină o minge roșie pe nas. Toți au explodat în hohote de râs uitându-se la Timida cum se învârte, să nu scape noul ei prieten. Curând, Timida însăși a râs când gărgărița a zburat în cele din urmă și a aterizat pe una dintre florile din apropiere.

Râsul lor a atras atenția celorlalți elevi și profesori, care nu s-au putut abține să nu zâmbească la vederea scenei hilare. Acest mic eveniment neașteptat cu gărgărița a ajutat pe toată lumea să realizeze cât de frumos poate fi atunci când împărtășești fericirea și râsul cu ceilalți.

De atunci, Timida și celelalte fete au devenit bune prietene și și-au amintit mereu ziua în care gărgărița le-a adus atâtea bucurii și râsete. Ei au învățat că adevărata valoare a prieteniei constă în bucurie și respect.`,
           questions:[]},
          {title:`Maniera și băieții din clasa a II-a`,
           body:`În regatul fermecat, unde elfii se îngrijeau de natură și de frumusețea de pe Pământ, trăia mica elfă Maniera. Ea își făcea adesea griji pentru copiii Pământului, în special pentru cei care nu prețuiau curățenia. Maniera știa că respectul față de natură și curățenia sunt esențiale pentru o viață bună.

Într-o școală de pe Pământ, un grup de băieți din clasa a II-a se distrau și mâncau gustări în timpul pauzei. După ce și-au mâncat napolitanele, au aruncat ambalajele în curte, unul dintre copii a scăpat un pahar cu iaurt și i-a dat cu piciorul în iarba din apropiere. În drum spre clasă, copiii au dat cu piciorul în mai multe uși și au pictat o săgeată pe un perete de pe hol, au râs și s-au jucat fără să se gândească la consecințele acțiunilor lor.

Într-o zi, în timp ce băieții aruncau din nou ambalaje de napolitane și sticle goale în iarbă, Maniera a zburat la ei. Ea a aterizat pe o bancă sub salcia din curtea școlii și le-a vorbit băieților: –Bună, băieți! Știați că fiecare acțiune a voastră lasă o amprentă asupra lumii noastre frumoase? Când păstrezi curățenia și ai grijă de mediu, ajuți natura.

Băieții s-au oprit și au ascultat-o cu atenție pe minunata mică elfă. Maniera a continuat: –Fiecare mizerie pe care o arunci, fiecare amprentă de pantofi și fiecare perete pictat ia din frumusețea școlii tale. Amenință vederea pentru profesorii și părinții tăi. Mamele voastre nu iubesc curățenia și frumusețea?

În timp ce vorbeau, un profesor s-a dus la directoarea școlii și a povestit ce au făcut copiii. Directoarea a decis că era timpul pentru o mică pedeapsă. Ea le-a ordonat băieților să curețe toată curtea și iarba din jurul școlii. În timp ce făceau curățenie, unul dintre băieți a răsturnat din greșeală un pahar cu iaurt pe pantofi. Toată lumea a izbucnit în râs privind cum încearcă să curețe laptele alb, acru și mirositor de pe pantofi. Acest moment amuzant i-a făcut să realizeze că și munca în echipă poate fi distractivă.

Băieții au decis să accepte și să respecte sfaturile Manierei. Au început să aibă grijă de școala lor și să respecte curățenia și natura. Și-au dat seama că fiecare acțiune a lor are un sens și o consecință. Au realizat că respectarea regulilor la școală este în sarcina lor, ca elevi. Datorită lecțiilor de maniere și experiențe amuzante cu iaurt, băieții au învățat cât de important este să păstrezi ordinea și curățenia la școală.`,
           questions:[`Voi aruncați gunoaiele în curtea școlii? Dar pe stradă?`,`Ce vei face dacă vezi un copil în fața ta care își aruncă hârtia de la micul-dejun în curte?`]},
          {title:`Maniera în vizită la Daniel și Ana`,
           body:`În regatul fermecat fiecare zi e magică, iar mica elfă Maniera urmărește cu atenție copiii de pe Pământ. Adesea își făcea griji pentru cei care uită să ajute acasă și lasă totul în seama părinților.

Într-o casă modestă, Daniel, în vârstă de 8 ani, și sora lui, Ana, în vârstă de 12 ani, ignorau adesea treburile casnice. Nu au vrut să-și facă ordine în cameră și șifonier, să-și plieze rufele și nici măcar să ajute la așezarea vaselor pe masă. Toate acestea au fost lăsate în seama mamei lor, care era adesea obosită de nesfârșitele îndatoriri casnice.

Într-o seară, în timp ce mama lor pregătea cina, iar Daniel și Ana se jucau la telefoanele lor, a apărut Maniera. Ea a intrat ca o rază de lumină prin fereastră și a aterizat pe umărul lui Daniel. –Bună, Daniel și Ana - șopti ea. Știați că a ajuta acasă poate fi distractiv și poate aduce bucurie? Toată lumea poate contribui la confortul casei.

Copiii o priveau uimiți. Maniera continuă: –De ce nu încercați să faceți un joc din aranjarea mesei sau împăturirea rufelor? Fiecare contribuție pe care o faceți o va face pe mama fericită și vă va învăța responsabilitatea și grija. Așa că mama va avea mai mult timp pentru distracție și conversații cu voi.

A doua zi, Daniel și Ana au decis să încerce. În timp ce aranjau masa, aceștia se certau cine va aranja mai repede vasele. Din grabă, Daniel a scăpat accidental o farfurie, care s-a rostogolit pe podea ca un frisbee. S-a rostogolit și s-a rostogolit, până când s-a oprit în cele din urmă chiar la picioarele mamei lor. În loc să țipe, mama a început să râdă și toată lumea a râs mult, mult timp. În timp ce strângeau rufele, Ana a decis să facă o casă din cearșaful de la pilotă, iar Daniel s-a strecurat înăuntru și s-a prefăcut a fi o fantomă. S-au distrat ajutând și și-au dat seama că a ajuta în treburile casnice se poate transforma în jocuri amuzante.

De-a lungul timpului, Daniel și Ana au devenit mai responsabili și și-au ajutat mama fără ca ea să fie nevoită să le ceară. Au învățat că și gesturile mici îi fac fericiți pe părinți. Datorită Manierei, Daniel și Ana au înțeles că a ajuta acasă nu este doar o obligație, ci și o modalitate de a arăta dragoste și respect față de familia ta. Au învățat să prețuiască efortul mamei lor, iar acum au grijă de casa lor cu bucurie.`,
           questions:[`Voi îi ajutați pe părinți acasă?`,`Care este munca ta preferată în gospodărie?`,`Dar care este cea mai grea?`]},
          {title:`Maniera și surorile Capricioasa, Lenevica și Răutăcioasa`,
           body:`În îndepărtatul regat magic sus în nori, mica elfă Maniera urmărea copiii de pe Pământ. Ea era ocrotitoarea bunelor maniere și mereu era îngrijorată dacă nu vedea fericire și bunătate din partea lor. Din regatul său, ea zărește surorile Capricioasa, Lenevica și Răutăcioasa, care aveau nevoie de ajutor de la Maniera.

Capricioasa, cea mai mică dintre surori, mereu făcea lucrurile să se întâmple așa cum voia ea. La școală refuza să coopereze cu alți copii, iar acasă se supăra, dacă nu primea ceea ce își dorea. Lenevica, sora mijlocie, își neglija constant datoriile. Nu-i păsa de munca de acasă și chiulea de la ore. Răutăcioasa, cea mai mare dintre surori, bârfea copiii și răspândea zvonuri.

Într-o seară, când erau în vizită la bunica lor, a apărut și Maniera. Decide să discute cu fiecare soră separat. Maniera le vorbește despre puterea cuvântului, a gândurilor bune, despre eforturi și prietenie adevărată. Capricioasei îi spune: –Știi tu, Capricioasa, când ne gândim și la ceilalți ne simțim fericiți? Să împărtășești și să faci bine este un gest frumos și plăcut! Lenevicăi, Maniera i-a șoptit: –Chiar și cel mai mic efort poate aduce mare bucurie. Dacă ajuți pe cineva, îl faci să se simtă important și el îți va răspunde cu bunătate. Și la sfârșit, Răutăcioasei i-a spus: –Să ai prieteni adevărați este un lucru foarte frumos. Ori de câte ori spui lucruri bune, inimile lor strălucesc de fericire.

În urma acestei întâlniri, surorile au început să se schimbe. Capricioasa a devenit îngăduitoare, Lenevica a început a ajuta cu sârguință, iar Răutăcioasa a schimbat felul de a vorbi și așa și-a făcut prieteni adevărați. La școală profesorii și colegii le-au observat schimbarea și au început a le respecta și să le placă de ele.

De dragul de a-și arăta noile calități, surorile au organizat un spectacol amuzant la școală. Rolurile lor erau să arate cum erau ele înainte și cum s-au transformat. Din acea zi, surorile s-au schimbat și au început să se comporte așa cum le-a spus Maniera. Bunătatea, efortul și înțelegerea sunt printre calitățile importante ale unui om fără de care nu pot fi fericiți. Lucrurile și gândirea pozitivă atrag pozitivul, cele negative atrag emoții negative care ne fac să ne simțim rău.`,

          {q:`De ce câinii dau din coadă?`,a:`Câinii dau din coadă pentru a arăta bucurie sau entuziasm.`},
          {q:`De ce au iepurii urechi lungi?`,a:`Iepurii au urechile lungi pentru a auzi mai bine prădătorii și pentru a se răcori în zilele călduroase.`},
          {q:`De ce nu zboară pinguinii?`,a:`Pinguinii nu zboară pentru că aripile lor sunt adaptate pentru înot, nu pentru zbor.`},
          {q:`De ce au gărgărițele puncte?`,a:`Gărgărițele au puncte pentru a avertiza prădătorii că sunt otrăvitoare.`},
          {q:`De ce au dispărut dinozaurii?`,a:`Dinozaurii au dispărut, probabil, din cauza unei combinații dintre un impact mare de asteroizi și erupții vulcanice care au schimbat clima.`},
          {q:`De ce au melcii cochilie?`,a:`Melcii au cochilie pentru protecție și pentru a preveni deshidratarea.`},
          {q:`De ce nu se pot ascunde elefanții în tufișuri?`,a:`Elefanții sunt animale foarte mari, așa că le este greu să se ascundă în tufișuri.`},
          {q:`De ce peștii nu pot vorbi?`,a:`Peștii nu vorbesc pentru că nu au corzi vocale, ca oamenii. De asemenea, nu au nici pleoape.`},
          {q:`De ce morcovii sunt portocalii?`,a:`Morcovii sunt portocalii datorită conținutului lor ridicat de beta-caroten, care este un tip de vitamina A.`},
          {q:`De ce copacii au scoarță?`,a:`Copacii au scoarță pentru a se proteja de dăunători, boli și răni fizice.`},
          {q:`De ce strălucesc licuricii?`,a:`Licuricii strălucesc datorită bioluminiscenței, care îi ajută să-și atragă perechea și să avertizeze prădătorii.`},
          {q:`De ce scuipă lamele?`,a:`Lamele scuipă pentru a se apăra sau pentru a arăta cine este mai puternic în grup.`},
          {q:`De ce strălucește Soarele?`,a:`Soarele strălucește din cauza reacțiilor termonucleare din miezul său, unde hidrogenul se transformă în heliu și eliberează energie.`},
          {q:`De ce sunt bananele curbate?`,a:`Bananele sunt curbate pentru că acestea cresc spre lumină, iar tulpina fructului se îndoaie în sus.`},
          {q:`De ce le place pisicilor să doarmă în locuri ciudate?`,a:`Pisicilor le place să doarmă în locuri ciudate pentru a căuta siguranță și confort.`},
          {q:`De ce cântă cocoșii dimineața?`,a:`Cocoșii cântă dimineața pentru a-și „marca” teritoriul și a atrage găinile.`},
          {q:`De ce iubesc șoarecii brânza?`,a:`Acesta este un mit. Șoarecii preferă, de fapt, cerealele și fructele în locul brânzei.`},
          {q:`De ce au caii potcoave?`,a:`Caii au potcoave pentru a li se proteja copitele de uzură și răni.`},
          {q:`De ce găinile ciugulesc pământul?`,a:`Găinile ciugulesc pământul pentru a găsi semințe, insecte și altele. De asemenea, ele nu au dinți, iar pietricelele din pământ adunate în pipotă au rolul de a le ajuta să digere mai bine mâncarea din stomac.`},
          {q:`De ce crocodilii au gura mare?`,a:`Crocodilii au gura mare pentru a face mai ușoare prinderea și sfâșierea prăzii.`},
          {q:`De ce zumzăie albinele?`,a:`Albinele zumzăie datorită mișcării rapide a aripilor lor, care creează acel sunet de zumzet.`},
          {q:`De ce maimuțele iubesc bananele?`,a:`Maimuțele adoră bananele pentru că sunt hrănitoare și delicioase, dar ele adoră și multe alte fructe.`},
          {q:`De ce sunt peștii uzi?`,a:`Peștii sunt uzi pentru că trăiesc în apă.`},
          {q:`De ce sar broaștele?`,a:`Broaștele sar pentru a se mișca cât mai rapid și a scăpa de prădători.`},
          {q:`De ce balena pulverizează apă în sus?`,a:`Balena pulverizează apă atunci când expiră aerul, iar acest jet de apă poate atinge chiar o înălțime de 23 m și este în forma literei V.`},
          {q:`De ce furnicile lucrează în echipă?`,a:`Furnicile lucrează în echipă pentru că astfel pot aduna mai multă hrană și se pot apăra mai bine.`},
          {q:`De ce caracatițele au opt tentacule?`,a:`Caracatițele au opt tentacule pentru a vâna.`},
          {q:`De ce pisicile urmăresc șoarecii?`,a:`Pisicile urmăresc șoarecii pentru că este un instinct de vânătoare care le ajută să supraviețuiască.`},
          {q:`De ce țestoasa își poartă casa pe spate?`,a:`Țestoasa își poartă casa (numită carapace) pe spate pentru protecție împotriva prădătorilor și a condițiilor meteo nefavorabile.`},
          {q:`De ce păianjenii țes pânze?`,a:`Păianjenii țes pânze pentru a prinde insecte și pentru a crea adăposturi.`},
          {q:`De ce se plimbă crabii în lateral?`,a:`Crabii merg în lateral deoarece corpurile lor sunt proiectate în așa fel încât mișcarea laterală să fie cea mai ușoară pentru ei.`},
          {q:`De ce se strâng aricii ca o minge?`,a:`Aricii se transformă într-o minge pentru a-și proteja părțile moi cu acele lor.`},
          {q:`De ce le place caprelor să se cațăre?`,a:`Caprele adoră să se cațăre pentru că sunt foarte agile și le ajută să evite prădătorii, de asemenea, pentru a găsi mâncare.`},
          {q:`De ce au cămilele cocoașe?`,a:`Cămilele au cocoașe pentru a depozita grăsimea, pe care o folosesc ca energie atunci când nu există mâncare și apă în deșert.`},
          {q:`De ce sapă câinii gropi?`,a:`Pentru a găsi ceva interesant.`}
        ]
      },
      {
        id: `bancuri3`,
        title: `Bancuri`,
        icon: `😂`,
        type: `list`,
        items: [
          {q:`— Dan, tu ai un vis al tău?<br>— Da, mamă! Visez să te ascult!<br>— Atunci de ce nu mă asculți?<br>— Vrei să rămân fără vis?`},
          {q:`Profesorul către elevi:<br>— Copii, numiți un animal care începe cu litera „I”.<br>Ștefan răspunde:<br>— Iepure.<br>— Bravo, foarte bine! Acum, numiți un alt animal care începe cu litera „A”?<br>Ștefan răspunde din nou:<br>— Alt iepure!<br>— Serios? Ieși din clasă! Acum, copii, numiți un animal cu litera „M”.<br>Ieșind, Ștefan strigă:<br>— Mare iepure?!`},
          {q:`Doi șoareci s-au întâlnit cu al treilea și i-au spus:<br>— Bună! Vom ucide leul! Vrei să participi și tu?<br>Al treilea șoarece s-a speriat:<br>— Dar el este foarte puternic! Ne va zdrobi pe toți trei!<br>Ceilalți doi șoareci îl liniștiră:<br>— Nu-ți face griji, vei avea o singură sarcină! Îl vei doborî la pământ. Apoi vine sarcina grea a noastră – îl vom bate până va leșina.`},
          {q:`O furnică și un elefant au decis să jefuiască un magazin. În timpul jafului, furnica i-a spus elefantului:<br>— Elefantule, m-au văzut! Fugi, poate pe tine nu te-au văzut încă...`},
          {q:`Două prăjituri se coc în același cuptor și una îi spune celeilalte:<br>— Este foarte cald aici!<br>Cealaltă, surprinsă:<br>— O, un fursec vorbitor!`},
          {q:`Doi copii au văzut un container arzând. Au găsit repede o femeie și au strigat:<br>— Doamnă, acest container este în flăcări, sunați la 112!<br>Femeia s-a stresat și a strigat:<br>— Nu știu care este numărul, copii!<br>(Voi știți?)`},
          {q:`Doi castraveți zburători s-au întâlnit pe cer. Unul dintre castraveți spune surprins:<br>— Ole, castravete zburător!<br>Celălalt răspunde și mai surprins:<br>— Ole, un castravete vorbitor!`},
          {q:`Un copil îl întreabă pe tatăl său:<br>— Tată, cât de mare vrei să devii?<br>— Acum sunt mare, Cristian.<br>— Atunci, de ce mănânci?<br>— Doar tu, Cristian, mănânci ca să crești. Eu mănânc ca să am putere să mă joc cu tine!`},
          {q:`Bunica îl întreabă pe nepotul ei:<br>— Știi câți ani are bunicul tău?<br>— Da, 7 ani.<br>— Nu are 7 ani, mai gândește-te!<br>— Bunicul a devenit bunic când m-am născut eu, așa că are 7 ani. Înainte de asta, era doar tatăl tatălui meu.`},
          {q:`Doi copii stropeau iarba din jurul casei cu pistoale cu apă. Bunica lor i-a întrebat:<br>— De ce stropiți iarba, copii?<br>— Stropim cu oțet împotriva crocodililor.<br>— Mi-ați irosit oțetul, nu sunt crocodili aici!<br>— Nu există crocodili pentru că noi i-am stropit!`},
          {q:`O mamă își strigă fiul, care se joacă pe stradă:<br>— Andrei, vino acasă puțin!<br>— Pentru ce, mamă? Nu sunt transpirat!<br>— Nu, îți este foarte sete de data asta!`},
          {q:`O mamă discută cu fiica ei:<br>— Emma, trebuie să fii mai organizată și să nu mai întârzii, oamenilor nu le place să aștepte.<br>— Mamă, am observat că oamenii care întârzie zâmbesc, iar cei care îi așteaptă sunt supărați. Vrei să fiu supărată ca oamenii care așteaptă?`},
          {q:`Un tată îl întreabă pe fiul său:<br>— Cum a decurs testul la matematică astăzi?<br>— Doamnei i-a plăcut foarte mult foaia albă, tată, și m-a invitat și mâine la test!`},
          {q:`O mamă își ceartă copilul:<br>— Gabi, ieri au fost 10 înghețate în congelator, azi e doar una.<br>— Oh, îmi pare rău, mamă, nu am văzut-o. O să o mănânc și pe aceea imediat.`},
          {q:`Tatăl către fiica lui:<br>— Alinuța, cum a fost astăzi la școală?<br>— Poți să afli de pe canalul meu de TikTok.`},
          {q:`Copiii se întâlnesc pe plajă și încep o conversație:<br>— Cum te numești?<br>— Marin.<br>— Unde te-ai născut, Marin?<br>— În România.<br>— Care parte?<br>— Cum care parte? M-am născut în România.`},
          {q:`Elefantul și furnica sunt pe o plajă lângă Dunăre. Elefantul a sărit imediat în apă pentru a se scălda, iar furnica tot căuta ceva prin bagaj. La un moment dat, ea îi spune elefantului:<br>— Elefantule, ieși o clipă din apă!<br>— De ce!?<br>— Ieși, te rog!<br>Elefantul s-a arătat:<br>— Spune-mi de ce?<br>— Nimic, nimic! Îmi caut costumul de baie și am vrut să verific dacă l-ai luat din greșeală.`},
          {q:`Un tată vorbește cu băiatul său:<br>— Mateo, ai făcut vreodată ceva curajos?<br>— Da, tată. Am ridicat mâna o dată la ora de istorie!`},
          {q:`Pavel, în vârstă de 8 ani, aleargă la bunicul său și îl întreabă:<br>— Bunicule, mai ai vreo carte de Ion Creangă?<br>— Bravo, Pavel! Vrei să citești mai multe cărți scrise de acest autor?<br>— Nu, bunicule! Am găsit 200 de lei în cartea lui Ion Creangă și caut mai mulți bani.`},
          {q:`Un elev de clasa a II-a vine acasă de la școală și îi spune mamei sale:<br>— Mamă, azi am avut un examen oftalmologic la școală. Ne-au pus diferite lupe și ne-au întrebat ce litere vedem la tablă.<br>— Grozav! Ce a spus doctorul, ochii tăi sunt bine?<br>— Mi-a spus să învăț alfabetul...`},
          {q:`Un tată își întreabă fiul de clasa a V-a:<br>— Andrei, haide, împăturește-ți hainele și pune-le în dulap.<br>— O să le împăturesc dacă ești de acord să ne jucăm cu mingea în curte după aceea.<br>— Hei, cât de inteligent m-ai refuzat!`},
          {q:`Tatăl și fiul fac teme la matematică:<br>— Tată, ajută-mă să găsesc perimetrul triunghiului.<br>— N-are rost, tată, îl caut de când eram student. Se pare că este greu de găsit.`},
          {q:`O mamă îl întreabă pe fiul ei:<br>— Când îți este cel mai greu la școală?<br>— În timpul dintre primul clopoțel de dimineață și ultimul clopoțel de încheiere a orelor, mamă.`},
          {q:`Două adolescente vorbesc la telefon:<br>— Mama m-a supărat foarte tare astăzi. A țipat din nou pentru camera mea dezordonată. Ca pedeapsă, mi-a spus să adun rufele când sunt uscate.<br>— Ei bine, ai scăpat de pedeapsă?<br>— Nu, a trebuit să le ud de trei ori. Încă sunt ude.`},
          {q:`Un tată îi dă o veste bună Mariei, în vârstă de 5 ani:<br>— Maria, în curând vei avea un frățior!<br>— Hei, grozav! Vino cu mine să te lauzi la mama. Această veste o va surprinde!`},
          {q:`Marinică, în vârstă de 8 ani, coboară din tramvai, salutând-o pe bunica lui.<br>— Bunico, am călcat pe picioare o femeie în tramvai fără să vreau, dar mi-am cerut imediat scuze. Mi-a zâmbit și mi-a dat o bomboană.<br>— Super, Marin! Ai fost recunoscător?<br>— Nu, am călcat-o din nou. Bomboanele ei sunt unele dintre preferatele mele.`},
          {q:`Profesorul întreabă:<br>— Marius, la ce visezi?<br>— Visez că am o bicicletă de pistă rapidă, ca tatăl meu.<br>— Tatăl tău are o bicicletă de pistă?<br>— Nu, și el visează asta...`},
          {q:`Bunica își întreabă nepotul de clasa I:<br>— Ai ridicat mâna azi la școală?<br>— Da, bunico!<br>— Bravo, băiete. La ce oră?<br>— La ora de matematică, am vrut să merg la baie.`},
          {q:`O mamă, enervată pe copiii ei:<br>— Ori de câte ori intru în camera voastră, sunteți mereu pe telefoane!<br>— Așa e... când luăm telefoanele, vii tu!`},
          {q:`Un adolescent o întreabă pe mama sa:<br>— Care-i treaba?<br>Mama, mulțumită de atenție, începe o conversație:<br>— Sunt bine, mamă, mulțumesc! Ce mai faci?<br>— Nu, mamă, ce ai de mâncare?`},
          {q:`Doi copii vorbesc:<br>— Știți că va fi un meci la stadion miercuri? Ce zi este azi?<br>— Nu știu. Se schimbă în fiecare zi aceste zile!`},
          {q:`Bunica își întreabă nepoata:<br>— Emilia, de ce închizi ochii când mănânci ciocolată?<br>— Mama crede că ciocolata mă înnebunește. M-a certat ieri. I-am promis mamei că nu mă voi uita la ciocolată.`},
          {q:`Ionuț îi amintește tatălui său:<br>— Tată, e ziua ta în curând!<br>— Da, fiule. Cel mai mare cadou ar fi să iei un 10 la matematică.<br>— E târziu, tată, ți-am cumpărat deja un tricou.`},
          {q:`Un tată și un fiu și-au pierdut câinele, Rocco. Ei se gândesc cum să-l găsească.<br>— Fiule, nu fi trist, îl găsim. Vom pune un anunț pe Facebook spunând că îl căutăm, vom pune afișe în cartier...<br>— Tată, nu va funcționa. Rocco nu va înțelege, nu are Facebook și nici nu poate citi afișe.`},
          {q:`Părinții îi anunță niște vești bune lui Cristian, în vârstă de 6 ani:<br>— Cris, îți cumpărăm un frate în curând.<br>— Da, întotdeauna sunt bani pentru prostii, dar nu există bani pentru scuter!`},
          {q:`Un câine a alergat cât a putut de repede prin deșert. O cămilă l-a văzut și l-a întrebat:<br>— Câine, unde te grăbești?<br>Câinele a răspuns:<br>— Mă grăbesc, că dacă nu găsesc curând un copac, fac pipi pe mine!`},
          {q:`E luni-dimineață, toată lumea se grăbește pentru școală, doar Andrei este încă în baie. Când iese, mama lui îl întreabă nervoasă:<br>— Ce ai făcut în baie atât timp?<br>— M-am spălat pe dinți de cinci ori, ca să nu mai fie nevoie să îi spăl în următoarele dimineți înainte de școală.`},
          {q:`Părinții își ceartă copilul:<br>— Te-am răsfățat atât de mult, acum trebuie să te pedepsim! începu tatăl.<br>— Vei fi fără telefon două zile! spuse mama încrezătoare.<br>Copilul a răspuns indignat:<br>— M-ați răsfățat și o să mă pedepsiți?! Dați-mi telefoanele pentru două zile!`},
          {q:`Mama vorbește cu fiul ei:<br>— Fiule, ți-am cumpărat manualele pentru școală, au fost scumpe, așa că te rog să ai grijă de ele!<br>— Bine, mamă, nici măcar nu mă ating de ele!`},
          {q:`O mamă, însărcinată cu al doilea copil, îl întreabă pe fiul ei:<br>— Ce vrei să nasc? Un frate sau o soră?!<br>— Vreau un CÂINE!...`},
          {q:`Profesorul îl certa pe Matei:<br>— Matei, nu poți dormi la ora de geografie!<br>— Pot, domnule profesor! Dar trebuie să vorbiți mai încet!`},
          {q:`Fiica o sună pe mama ei:<br>— Mamă, vino să mă iei, nu vreau să mă mai joc cu băieții ăștia! Țipă, dau cu piciorul, nu mă ascultă.<br>— Lili, nu pot, aceștia sunt fiii tăi, până la urmă!`},
          {q:`Un băiat își vizitează bunica. Bunica îl întreabă îngrijorată:<br>— Alex, ai sunat-o pe mama ta?<br>— Nu, bunico, mi-a căzut bateria.<br>— Unde a căzut bateria? Hai, băiete, să o căutăm repede înainte să afle tatăl tău!`},
          {q:`Bunica Nadia adoarme cu ochelarii la ochi, iar Victoria, surprinsă, o întreabă:<br>— Bunico, ai de gând să dormi cu ochelarii la ochi?<br>— Da, altfel cum voi vedea în timp ce visez?`},
          {q:`Profesorul întreabă:<br>— Copii, ce v-a plăcut cel mai mult la această lecție de literatură?<br>— Cum a căzut Florin de pe scaun, doamnă.`},
          {q:`La sfârșitul verii, un bărbat și o femeie vorbesc între ei:<br>— Dragă, sunt gata copiii?<br>— Ei sunt gata, dar eu nu sunt!<br>— Gata, nu gata, vara s-a terminat! Trebuie să îi luăm de la părinții tăi. Peste două săptămâni vor fi la școală!`},
          {q:`Profesorul lasă o observație în carnetul unei eleve: „Roxana vorbeşte prea mult”.<br>Tatăl, după ce semnează observaţia, adaugă:<br>— „Dacă i-aţi cunoaşte mama...”`},
          {q:`Gabriel se întoarce acasă de la școală trist:<br>— Tată, te va suna directorul mâine.<br>— Iarăși?<br>— Am spart un ghiveci cu flori de pe coridor.<br>— Hmm, câte ghivece erau pe coridor?`},
          {q:`La ședința cu părinții:<br>— Doamnă Raykova, fiul dvs. este foarte tăcut în clasă.<br>— Nu se poate! Acasă nu tace deloc!`},
          {q:`Tatăl și fiul vorbesc:<br>— Tată, te-a lovit bunicul când erai mic?<br>— M-a lovit.<br>— Tatăl său l-a lovit când era mic?<br>— Desigur!<br>— Tată, cu ajutorul tău, putem opri această violență domestică?`},
          {q:`Fiica își întreabă tatăl:<br>— Tată, ce înseamnă „binele naște bine!”?<br>— Foarte simplu: bunica ta a născut-o pe mama ta, iar mama ta te-a născut pe tine!<br>— Tată, ai înțeles ideea...`},
          {q:`George a tras un vânt zgomotos și urât mirositor în timpul orei. Profesorul s-a supărat și l-a dat afară din clasă. George stătea în fața ușii, când o profesoară a trecut pe lângă el și l-a întrebat de ce este afară.<br>— Nu știu, doamnă, am tras un vânt și m-a scos la aer curat. Acum ceilalți se sufocă înăuntru.`},
          {q:`O mamă o întreabă pe fiica ei:<br>— Ce ai învățat astăzi la școală?<br>— Evident nu suficient, pentru că și mâine sunt nevoită să mă duc la școală!`},
          {q:`Un profesor îi spune lui Mihai:<br>— Mihai, trezește-l pe Laurențiu, care doarme lângă tine de 10 minute.<br>— Oooo, nu! Dvs. să îl treziți, că tot dvs. l-ați adormit.`},
          {q:`Profesorul, către Daniel:<br>— Știi ce înseamnă să fii diplomat?<br>Daniel răspunde:<br>— Să te gândești de două ori înainte de a nu spune nimic!`},
          {q:`Profesorul îl întreabă pe un elev din clasa a III-a:<br>— Tudor, de ce nu ți-ai făcut temele?<br>— Pentru că mi-a mâncat câinele temele!<br>— Tudor, știu că nu ai câine acasă!<br>— Tocmai de aceea nu am câine – mănâncă teme!`},
          {q:`Emilia ajunge acasă de la școală și se plânge mamei ei:<br>— Mamă, am fost astăzi cu clasa la vaccin.<br>— Sper că nu ți-a fost frică de injecție, Emilia! Ai plâns?<br>— Nu am plâns, mamă, doctorul nu m-a putut prinde!`},
          {q:`O mamă îl întreabă îngrijorată pe fiul ei:<br>— De ce nu vrei să mergi la școală?<br>— Profesorii nu mă plac, iar elevii mă enervează.<br>— Ai două motive să mergi la școală! Mai întâi, ai 48 de ani și al doilea, ești directorul școlii!`},

        items: [
          {
            title: `Ciocolată-OOO-frate`,
            body: `„Ciocolată, ciocolată!” – fratele meu mereu vrea încă o bucată.\nFrate, înțelege, altceva nu poți alege?! Ciocolata îți dă energie, nu mai face atâta dramaturgie.\nE seară, fă-ți patul și termină cu mâncatul!\n— Vreau ciocolată! Vreau ciocolată!\nDe la ciocolată, frate, obosesc. Repede mă ghemuiesc și adorm, mărturisesc.\n— Oh, bine, dar doar o bucată!\nNicky ciocolata a apucat-o și pe toată a mâncat-o, iar pijamaua lui curată este deja cu pată...\nDin pat sare ca un cascador și fuge pe coridor. Mama se trezi și după ea o tuli.\n— Opriți-vă deja – strigă tata când perna aranja. Limitele împingeți, luminile acum să le stingeți!\nNicky acum se întreba cum energia ar astâmpăra, nu putea să doarmă, era ca o alarmă...\n— Cine i-a dat ciocolata? Tatăl a ieșit nervos.\n— Haide, ajunge! Eu i-am dat ciocolata, eu sunt vinovat, dar se ruga așa tare, nu eu sunt fratele MAI MARE?\n... Și așa mai departe din vremuri îndepărtate. E noroc să ai un frate! Și de ciocolată tu să ai parte. Nu-ți faci griji, nu te ceartă, doar mănânci, mănânci, pe toată. Dar ce noroc să ai un frate! Pentru tine e să ia parte!\nHei, copii, a avea un frate sau o soră este cel mai mare noroc! Uneori vă certați, alteori vă enervați, dar sunteți mereu, mereu împreună. Cei mari îi învață pe cei mici cum să fie curajoși, cum să își dorească mai mult – și uneori asta îi bagă în bucluc.\n„Cine i-a dat ciocolata?” – este întotdeauna vina celui mare. De ce? Pentru că e mai mare, pentru că știe mai multe, pentru că își poate asuma responsabilitatea. Părinții nu o fac intenționat, nu o fac pentru că îi iubesc mai mult pe cei mici. Știu doar că cel mare poate înțelege că se poate descurca.\nȘi cei mici? Sunt norocoșii! Ei au întotdeauna pe cineva care îi va proteja, care le va arăta calea, care le va da ciocolată chiar și atunci când nu trebuie. Și într-o zi, când se vor face mari, își vor da seama ce dar minunat este să ai frate sau soră.`,
            questions: [`Dacă aveți un frate sau o soră, spuneți-i chiar acum: „Mulțumesc!”. Pentru jocuri, pentru secrete, pentru amintirile voastre, pentru că îi aveți mereu alături.`]

          {
            title: `Iepurașul rOtund`,
            body: `În grădina unui bunic aleargă un iepuraș voinic, a găsit un loc prielnic plin de morcovi... ce feeric!\nRoade unul, roade doi, burta-i mare ca un butoi, nu poate să se rostogolească, parcă-i gata să pocnească!\nVine bunicul supărat: — Iepuraș neastâmpărat! Nu mai mânca morcovel, gustă mere sau sparanghel!\nDar urecheatul pufos râde dulce și sfios: — Morcovul e prea gustos, nu-l las, sunt prea pofticios!\n— Pleacă tu, măi, blăniță! — Iar îmi strici tu a mea grădiniță! Însă iepurașul e în impas... Nu se mișcă niciun pas.\nBurta plină îl oprește, abia-abia mai pășește, iar bunicul, blând, zâmbește: — Hai, ia și te odihnește!\nȘi de-atunci au un târg bun: Morcovi, doar din când în când, iar bunicul îi dă alt drum, cu salată și-un pupic blând!`,
            questions: [`Hei, copii, nu vă fie teamă de greșeli – chiar dacă faceți greșeli, asumați-vă responsabilitatea. Adulții vă vor ajuta, veți învăța ceva important și veți deveni mai înțelepți.`]
          },
          {
            title: `Să crezi în tine`,
            body: `Știu că uneori vi se pare că toată lumea se uită la voi și vă judecă – că sunteți prea înalt, scund, rotund sau slab. Că aveți picioarele lungi și stângace sau că burta este mai mare decât a altora. Dar să știți – acest lucru este temporar.\nAți văzut cei mai buni jucători de baschet? Unii dintre ei au fost cei mai înalți din clasă când erau mici, s-au împiedicat de picioare, dar apoi această înălțime i-a făcut campioni. Și știați că mulți gimnaști și dansatori erau mici și flexibili când erau copii?\nCorpul vostru se schimbă în fiecare zi. În medie, copiii de 10 ani cresc cu aproximativ 5-7 cm pe an. Ceea ce pare un inconvenient astăzi poate fi superputerea voastră mâine. Dar pentru a crește puternic și rapid, trebuie să aveți grijă de voi. Mănâncă alimente delicioase și sănătoase – mere crocante, morcovi dulci, roșii zemoase, chiar și sfeclă, brânză, pește, nuci. Corpul tău are nevoie de combustibil pentru a crește. Și mișcă-te – înoată, lovește o minge, dansează, sari, mergi cu bicicleta, aleargă!\nNu lăsa pe nimeni să-ți spună că nu ești suficient de bun, suficient de frumos, suficient de înalt. După fiecare iarnă, vine primăvara – și vei vedea că ai crescut, ai devenit mai puternic și nimic nu te mai poate opri.`,

          }

          {q:`Supă de piatră<br>Iepurele Bayo mergea în fiecare zi la restaurantul din pădure și punea invariabil aceeași întrebare:<br>— Bună ziua, aveți supă de piatră?<br>Chelnerul, epuizat de întrebarea repetată, în cele din urmă nu a mai suportat și s-a plâns bucătarului. Hotărât să pună capăt acestei povești, a doua zi, bucătarul a făcut chiar supă de piatră.<br>Când Iepurele a apărut din nou și a pus întrebarea lui obișnuită, chelnerul, mulțumit de sine, a răspuns zâmbind:<br>— Avem!<br>Iepurele, uimit, s-a uitat la el și a întrebat:<br>— Serios? Și cine comandă?<br>✍️ Autor: Velislava Decheva`},
          {q:`5 kg de morcovi<br>Ariciul Bejko a deschis o nouă ciupercărie în pădure. Iepurele a venit și a spus:<br>— Ariciule, dă-mi 5 kg de morcovi.<br>— Iepuraș, aceasta este o ciupercărie – a răspuns Ariciul.<br>A doua zi, Iepurașul a venit din nou.<br>— Ariciule, dă-mi 5 kg de morcovi.<br>— Iepuraș, ți-am spus ieri – aceasta este o ciupercărie.<br>În a treia, a patra și a cincea zi, s-a întâmplat din nou același lucru. În a șasea zi, când Iepurele a intrat în magazin și a cerut 5 kg de morcovi, Ariciul s-a înfuriat și a răspuns:<br>— Iepuraș, îți spun în fiecare zi că acesta este un magazin de ciuperci, dacă vii din nou la mine să ceri morcovi, îți voi bate urechile în perete cu cuie.<br>A doua zi, Iepurele a intrat în magazin.<br>— Bună ziua, Ariciule!<br>— Bună ziua, Iepuraș.<br>— Ai cuie? a întrebat Iepurele.<br>Ariciul a oftat adânc și a spus:<br>— Nu am, Iepuraș.<br>— Ei bine, dă-mi 5 kg de morcovi atunci.<br>✍️ Autor: Jean-Marie Tsanova, 9 ani`},
          {q:`Poveste amuzantă: Victor la cantina școlii<br>Lui Victor nu i-a plăcut mâncarea de la cantina școlii, dar într-o zi a arătat în mod surprinzător interes. A rugat-o pe mama lui să îl înscrie la prânz, pentru că îi plăcea fasolea. Mama lui a decis să plătească doar pentru ziua aceea, ca să vadă dacă îi va plăcea.<br>După școală, l-a întâmpinat cu nerăbdare și l-a întrebat:<br>— Ți-a plăcut mâncărica de fasole?<br>Victor a răspuns nesigur:<br>— Da... mi-a plăcut foarte mult!<br>Inspirată de răspuns, mama s-a oferit imediat să îl înscrie din nou. Dar în loc să fie de acord, Victor s-a uitat la ea cu îngrijorare și a întrebat-o serios:<br>— Ești sigură că ai parcat corect? Cred că i-am văzut pe tipii ăia care blochează roțile... Hai să mergem mai repede!<br>✍️ Autor: Victoria Danailova, 9 ani`},
